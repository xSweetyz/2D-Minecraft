<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Terraria 2D Survival Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: fixed;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 12px;
    }

    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      justify-content: space-between;
      z-index: 15;
      pointer-events: none;
    }
    .touch-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.7);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      outline: none;
    }
    .touch-btn:active {
      background: rgba(56, 189, 248, 0.5);
      transform: scale(0.92);
    }

    #inventory-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 12px;
      width: 92%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      z-index: 20;
      color: #fff;
    }
    #inventory-modal h2 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }
    .section-title {
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 3px;
      font-weight: bold;
    }
    .inventory-container {
      display: flex;
      gap: 8px;
    }
    .main-inv-area {
      flex: 1;
    }
    .armor-equip-area {
      width: 50px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 8px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }
    .inv-slot {
      width: 42px;
      height: 42px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .inv-slot canvas { width: 26px; height: 26px; image-rendering: pixelated; pointer-events: none; }
    .inv-slot b {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 9px;
      color: #fff;
      text-shadow: 1px 1px #000;
      pointer-events: none;
    }

    #tooltip {
      display: none;
      position: fixed;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 90px;
      overflow-y: auto;
    }
    .recipe-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.8);
      padding: 4px 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
    }
    .recipe-card.disabled { opacity: 0.4; }
    .craft-btn { background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="tooltip"></div>

  <div id="ui">
    <div class="hud-card">
      <span id="health-display">❤️ 100 / 100</span>
      <span style="opacity: 0.3;">|</span>
      <span id="time-display">☀️ Gündüz</span>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="touch-group">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn" id="btn-jump">⬆</button>
      <button class="touch-btn" id="btn-inv">📦</button>
      <button class="touch-btn" id="btn-action">⛏️</button>
    </div>
  </div>

  <div id="inventory-modal">
    <h2>ENVANTER VE ÜRETİM</h2>
    <div class="inventory-container">
      <div class="main-inv-area">
        <div class="section-title">Hotbar (Hızlı Erişim - 5 Slot)</div>
        <div class="inv-grid" id="modal-hotbar-grid"></div>
        <div class="section-title">Ana Depo (17 Slot)</div>
        <div class="inv-grid" id="modal-storage-grid" style="grid-template-columns: repeat(4, 1fr);"></div>
      </div>
      <div class="armor-equip-area">
        <div class="section-title">Zırhlar</div>
        <div class="inv-slot" id="armor-slot-head"></div>
        <div class="inv-slot" id="armor-slot-chest"></div>
        <div class="inv-slot" id="armor-slot-legs"></div>
        <div class="inv-slot" id="armor-slot-boots"></div>
      </div>
    </div>
    <div class="section-title" style="margin-top: 5px;">Üretim Reçeteleri</div>
    <div class="recipe-list" id="recipe-list"></div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById("mobile-controls").style.display = "flex";
  }
}
window.addEventListener("resize", resize);
resize();

const TILE_SIZE = 32;
const ZOOM = 1.5; 
const MAP_W = 200;
const MAP_H = 120;

const ITEM_TYPES = {
  0: { name: "Hava", solid: false },
  1: { name: "Çimen", solid: true, time: 30, color: "#5bb32a", darkColor: "#3e801b", borderHighlight: "#8ee356" },
  2: { name: "Toprak", solid: true, time: 40, color: "#866043", darkColor: "#573d2a", borderHighlight: "#a37857" },
  3: { name: "Taş", solid: true, time: 140, needTool: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3" },
  4: { name: "Ağaç Gövdesi", solid: true, time: 80, color: "#674627", darkColor: "#3d2815", borderHighlight: "#8a5e36" },
  5: { name: "Yaprak", solid: false, time: 15, color: "#2d8a1e", darkColor: "#1a5710", borderHighlight: "#45b033" },
  6: { name: "Kömür", solid: true, time: 180, needTool: true, isOre: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#171717" },
  7: { name: "Bakır", solid: true, time: 220, needTool: true, isOre: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#f97316" },
  8: { name: "Ahşap Blok", solid: true, time: 60, color: "#a16207", darkColor: "#713f12", borderHighlight: "#ca8a04" },
  9: { name: "Çubuk", solid: false, isItem: true, color: "#78350f" },
  10: { name: "Tahta Kazma", solid: false, isTool: true, speed: 4.0, color: "#d97706" },
  11: { name: "Taş Kazma", solid: false, isTool: true, speed: 8.0, color: "#94a3b8" },
  12: { name: "Bakır Kazma", solid: false, isTool: true, speed: 14.0, color: "#f97316" },
  13: { name: "Taş Kask", solid: false, isArmor: true, armorType: 'head', color: "#64748b" },
  14: { name: "Taş Göğüslük", solid: false, isArmor: true, armorType: 'chest', color: "#64748b" },
  15: { name: "Taş Pantolon", solid: false, isArmor: true, armorType: 'legs', color: "#475569" },
  16: { name: "Taş Bot", solid: false, isArmor: true, armorType: 'boots', color: "#334155" },
  17: { name: "Bakır Kask", solid: false, isArmor: true, armorType: 'head', color: "#ea580c" },
  18: { name: "Bakır Göğüslük", solid: false, isArmor: true, armorType: 'chest', color: "#ea580c" },
  19: { name: "Bakır Pantolon", solid: false, isArmor: true, armorType: 'legs', color: "#c2410c" },
  20: { name: "Bakır Bot", solid: false, isArmor: true, armorType: 'boots', color: "#9a3412" }
};

let world = [];
let surfaceY = 40;

function initWorld() {
  world = [];
  for (let y = 0; y < MAP_H; y++) {
    world[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      if (y < curSurface) {
        world[y][x] = 0;
      } else if (y === curSurface) {
        world[y][x] = 1;
      } else if (y < curSurface + 10) {
        world[y][x] = 2;
      } else {
        let r = Math.random();
        if (r < 0.06) world[y][x] = 6;
        else if (r < 0.09) world[y][x] = 7;
        else world[y][x] = 3;
      }
    }
  }

  for (let x = 8; x < MAP_W - 8; x += Math.floor(Math.random() * 5) + 5) {
    if (Math.random() > 0.3) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      let treeH = Math.floor(Math.random() * 3) + 4;
      for (let h = 1; h <= treeH; h++) {
        if (curSurface - h >= 0) world[curSurface - h][x] = 4;
      }
      let top = curSurface - treeH;
      for (let lx = -2; lx <= 2; lx++) {
        for (let ly = -3; ly <= -1; ly++) {
          if (world[top + ly] && world[top + ly][x + lx] === 0) {
            world[top + ly][x + lx] = 5;
          }
        }
      }
    }
  }
}
initWorld();

let timeOfDay = 0;
function updateTime(amount) {
  timeOfDay = (timeOfDay + amount) % 1.0;
  document.getElementById("time-display").innerText = timeOfDay < 0.5 ? "☀️ Gündüz" : "🌙 Gece";
}

let player = {
  x: 20 * TILE_SIZE,
  y: (surfaceY - 4) * TILE_SIZE,
  w: 18,
  h: 42,
  vx: 0,
  vy: 0,
  accX: 0.6,
  maxSpeed: 2.8,
  friction: 0.8,
  grounded: false,
  facing: 1,
  selectedSlot: 0,
  animFrame: 0
};

let camX = player.x;
let camY = player.y;

const hotbar = [
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }
];
const storage = [
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }
];

const equippedArmor = {
  head: { id: 0, count: 0 },
  chest: { id: 0, count: 0 },
  legs: { id: 0, count: 0 },
  boots: { id: 0, count: 0 }
};

const itemCounts = {};

function updateItemCounts() {
  for (let key in itemCounts) delete itemCounts[key];
  const tally = (slot) => {
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      itemCounts[slot.id] = (itemCounts[slot.id] || 0) + slot.count;
    } else {
      slot.id = 0;
      slot.count = 0;
    }
  };
  hotbar.forEach(tally);
  storage.forEach(tally);
  Object.values(equippedArmor).forEach(tally);
}

function addPlayerItem(itemId, count = 1) {
  for (let i = 0; i < hotbar.length; i++) {
    if (hotbar[i].id === itemId) { hotbar[i].count += count; updateItemCounts(); return; }
  }
  for (let i = 0; i < storage.length; i++) {
    if (storage[i].id === itemId) { storage[i].count += count; updateItemCounts(); return; }
  }
  for (let i = 0; i < hotbar.length; i++) {
    if (hotbar[i].id === 0 || hotbar[i].count <= 0) { hotbar[i].id = itemId; hotbar[i].count = count; updateItemCounts(); return; }
  }
  for (let i = 0; i < storage.length; i++) {
    if (storage[i].id === 0 || storage[i].count <= 0) { storage[i].id = itemId; storage[i].count = count; updateItemCounts(); return; }
  }
}

function consumePlayerItem(itemId, amount = 1) {
  let remaining = amount;
  for (let i = storage.length - 1; i >= 0; i--) {
    if (remaining > 0 && storage[i].id === itemId) {
      let take = Math.min(storage[i].count, remaining);
      storage[i].count -= take;
      remaining -= take;
      if (storage[i].count <= 0) { storage[i].id = 0; storage[i].count = 0; }
    }
  }
  for (let i = hotbar.length - 1; i >= 0; i--) {
    if (remaining > 0 && hotbar[i].id === itemId) {
      let take = Math.min(hotbar[i].count, remaining);
      hotbar[i].count -= take;
      remaining -= take;
      if (hotbar[i].count <= 0) { hotbar[i].id = 0; hotbar[i].count = 0; }
    }
  }
  updateItemCounts();
}

const keys = {};
let mining = { active: false, x: -1, y: -1, progress: 0 };

function bindTouchButton(id, actionDown, actionUp) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener("touchstart", (e) => { e.preventDefault(); actionDown(); }, { passive: false });
  btn.addEventListener("touchend", (e) => { e.preventDefault(); if (actionUp) actionUp(); }, { passive: false });
  btn.addEventListener("mousedown", (e) => { e.preventDefault(); actionDown(); });
  btn.addEventListener("mouseup", (e) => { e.preventDefault(); if (actionUp) actionUp(); });
}

bindTouchButton("btn-left", () => keys["a"] = true, () => keys["a"] = false);
bindTouchButton("btn-right", () => keys["d"] = true, () => keys["d"] = false);
bindTouchButton("btn-jump", () => {
  if (player.grounded) { player.vy = -6.8; player.grounded = false; }
});
bindTouchButton("btn-inv", () => toggleInventoryModal());

// Dokunmatik Aksiyon Butonu (Blok Kırma / Koyma)
bindTouchButton("btn-action", () => {
  let targetX = player.x + player.w / 2 + (player.facing * TILE_SIZE * 1.3);
  let targetY = player.y + player.h / 2;
  let tx = Math.floor(targetX / TILE_SIZE);
  let ty = Math.floor(targetY / TILE_SIZE);

  if (tx >= 0 && tx < MAP_W && ty >= 0 && ty < MAP_H) {
    if (world[ty][tx] !== 0) {
      let mined = world[ty][tx];
      world[ty][tx] = 0;
      addPlayerItem(mined, 1);
    } else {
      let activeSlot = hotbar[player.selectedSlot];
      let activeItem = activeSlot.count > 0 ? activeSlot.id : 0;
      if (activeItem && !ITEM_TYPES[activeItem].isTool && !ITEM_TYPES[activeItem].isItem && !ITEM_TYPES[activeItem].isArmor) {
        world[ty][tx] = activeItem;
        consumePlayerItem(activeItem, 1);
      }
    }
  }
});

function isSolidBlock(px, py) {
  let tx = Math.floor(px / TILE_SIZE);
  let ty = Math.floor(py / TILE_SIZE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return ITEM_TYPES[world[ty][tx]].solid;
}

function updatePhysics() {
  if (keys["a"]) {
    player.vx -= player.accX;
    player.facing = -1;
    updateTime(0.0005);
  } else if (keys["d"]) {
    player.vx += player.accX;
    player.facing = 1;
    updateTime(0.0005);
  } else {
    player.vx *= player.friction;
  }

  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.vy += 0.42;

  if (Math.abs(player.vx) > 0.2 && player.grounded) player.animFrame += 0.2;
  else player.animFrame = 0;

  player.x += player.vx;
  if (player.vx > 0 && (isSolidBlock(player.x + player.w, player.y) || isSolidBlock(player.x + player.w, player.y + player.h - 2))) {
    player.x = Math.floor((player.x + player.w) / TILE_SIZE) * TILE_SIZE - player.w - 0.1;
    player.vx = 0;
  }
  if (player.vx < 0 && (isSolidBlock(player.x, player.y) || isSolidBlock(player.x, player.y + player.h - 2))) {
    player.x = Math.floor(player.x / TILE_SIZE + 1) * TILE_SIZE + 0.1;
    player.vx = 0;
  }

  player.y += player.vy;
  player.grounded = false;
  if (player.vy > 0 && (isSolidBlock(player.x + 2, player.y + player.h) || isSolidBlock(player.x + player.w - 2, player.y + player.h))) {
    player.y = Math.floor((player.y + player.h) / TILE_SIZE) * TILE_SIZE - player.h;
    player.vy = 0;
    player.grounded = true;
  }
}

function renderTile(id, x, y, size, targetCtx) {
  if (!id || id === 0) return;
  const info = ITEM_TYPES[id];
  
  if (info.isTool) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + 4, y + 6, size - 8, 5);
    targetCtx.fillStyle = "#78350f";
    targetCtx.fillRect(x + size / 2 - 2, y + 10, 4, size - 14);
    return;
  }
  if (info.isItem) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + size / 2 - 2, y + 4, 4, size - 8);
    return;
  }
  if (info.isArmor) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + 4, y + 4, size - 8, size - 8);
    return;
  }

  targetCtx.fillStyle = info.color;
  targetCtx.fillRect(x, y, size, size);
  targetCtx.fillStyle = info.borderHighlight;
  targetCtx.fillRect(x, y, size, 3);
  targetCtx.fillRect(x, y, 3, size);
  targetCtx.fillStyle = info.darkColor;
  targetCtx.fillRect(x, y + size - 3, size, 3);
  targetCtx.fillRect(x + size - 3, y, 3, size);

  if (id === 1) {
    targetCtx.fillStyle = "#866043";
    targetCtx.fillRect(x + 3, y + 10, size - 6, size - 13);
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x, y, size, 8);
  } else if (id === 6 || id === 7) {
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 4, y + 5, 5, 5);
    targetCtx.fillStyle = info.oreColor;
    targetCtx.fillRect(x + 6, y + 7, 5, 5);
  }
}

function renderPlayerTerraria(screenX, screenY) {
  let anim = Math.sin(player.animFrame) * 4;
  ctx.save();
  ctx.translate(screenX + player.w / 2, screenY + player.h / 2);
  if (player.facing === -1) ctx.scale(-1, 1);

  ctx.fillStyle = "#451a03";
  ctx.fillRect(-6, 15 + anim, 5, 5);
  ctx.fillRect(2, 15 - anim, 5, 5);

  ctx.fillStyle = "#1e3a8a";
  ctx.fillRect(-6, 5, 5, 10);
  ctx.fillRect(2, 5, 5, 10);

  ctx.fillStyle = "#dc2626";
  ctx.fillRect(-7, -8, 14, 13);

  ctx.fillStyle = "#fca5a5";
  ctx.fillRect(-10, -6 - anim * 0.5, 4, 10);
  ctx.fillRect(-6, -21, 13, 13);

  ctx.fillStyle = "#78350f";
  ctx.fillRect(-7, -23, 15, 4);

  ctx.restore();
}

function render() {
  camX += (player.x - camX) * 0.1;
  camY += (player.y - camY) * 0.1;

  ctx.save();
  ctx.scale(ZOOM, ZOOM);

  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;
  let drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, camX - viewW / 2));
  let drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, camY - viewH / 2));

  let skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
  if (timeOfDay < 0.5) {
    skyGrad.addColorStop(0, "#0284c7");
    skyGrad.addColorStop(1, "#7dd3fc");
  } else {
    skyGrad.addColorStop(0, "#020617");
    skyGrad.addColorStop(1, "#0f172a");
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, viewW, viewH);

  let startX = Math.max(0, Math.floor(drawCamX / TILE_SIZE));
  let endX = Math.min(MAP_W, Math.ceil((drawCamX + viewW) / TILE_SIZE));
  let startY = Math.max(0, Math.floor(drawCamY / TILE_SIZE));
  let endY = Math.min(MAP_H, Math.ceil((drawCamY + viewH) / TILE_SIZE));

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      let tile = world[y][x];
      if (tile !== 0) {
        renderTile(tile, x * TILE_SIZE - drawCamX, y * TILE_SIZE - drawCamY, TILE_SIZE, ctx);
      }
    }
  }

  renderPlayerTerraria(player.x - drawCamX, player.y - drawCamY);
  ctx.restore();

  renderCanvasHotbarUI();
}

function renderCanvasHotbarUI() {
  const slotSize = 40;
  const gap = 5;
  const startX = (canvas.width - (5 * slotSize + 4 * gap)) / 2;
  const startY = canvas.height - slotSize - 10;

  updateItemCounts();

  for (let i = 0; i < 5; i++) {
    let sx = startX + i * (slotSize + gap);
    let sy = startY;

    ctx.fillStyle = i === player.selectedSlot ? "rgba(56, 189, 248, 0.3)" : "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(sx, sy, slotSize, slotSize);

    ctx.strokeStyle = i === player.selectedSlot ? "#38bdf8" : "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = i === player.selectedSlot ? 2.5 : 1;
    ctx.strokeRect(sx, sy, slotSize, slotSize);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 8px sans-serif";
    ctx.fillText(i + 1, sx + 3, sy + 9);

    let slot = hotbar[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      renderTile(slot.id, sx + 4, sy + 4, 32, ctx);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(slot.count, sx + slotSize - 2, sy + slotSize - 2);
        ctx.textAlign = "left";
      }
    }
  }
}

function buildInventoryUI() {
  updateItemCounts();

  const hbGrid = document.getElementById("modal-hotbar-grid");
  hbGrid.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    let slotDiv = document.createElement("div");
    slotDiv.className = "inv-slot";
    let slot = hotbar[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      let c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      renderTile(slot.id, 0, 0, 32, c.getContext("2d"));
      slotDiv.appendChild(c);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        let b = document.createElement("b");
        b.innerText = slot.count;
        slotDiv.appendChild(b);
      }
    }
    slotDiv.onclick = () => { player.selectedSlot = i; toggleInventoryModal(); };
    hbGrid.appendChild(slotDiv);
  }

  const stGrid = document.getElementById("modal-storage-grid");
  stGrid.innerHTML = "";
  for (let i = 0; i < storage.length; i++) {
    let slotDiv = document.createElement("div");
    slotDiv.className = "inv-slot";
    let slot = storage[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      let c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      renderTile(slot.id, 0, 0, 32, c.getContext("2d"));
      slotDiv.appendChild(c);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        let b = document.createElement("b");
        b.innerText = slot.count;
        slotDiv.appendChild(b);
      }
    }
    stGrid.appendChild(slotDiv);
  }

  const list = document.getElementById("recipe-list");
  list.innerHTML = "";
  craftingRecipes.forEach(r => {
    let canCraft = Object.keys(r.cost).every(k => (itemCounts[k] || 0) >= r.cost[k]);
    let card = document.createElement("div");
    card.className = "recipe-card" + (canCraft ? "" : " disabled");
    card.innerHTML = `<span>${r.name}</span><span class="craft-btn">${canCraft ? "ÜRET" : "Eksik"}</span>`;
    card.onclick = () => {
      if (canCraft) {
        Object.keys(r.cost).forEach(k => consumePlayerItem(parseInt(k), r.cost[k]));
        addPlayerItem(r.item, r.count);
        buildInventoryUI();
      }
    };
    list.appendChild(card);
  });
}

const craftingRecipes = [
  { item: 8, count: 4, cost: { 4: 1 }, name: "Ahşap Blok (4x)" },
  { item: 9, count: 4, cost: { 8: 2 }, name: "Ahşap Çubuk (4x)" },
  { item: 10, count: 1, cost: { 8: 3, 9: 2 }, name: "Tahta Kazma" },
  { item: 11, count: 1, cost: { 3: 3, 9: 2 }, name: "Taş Kazma" },
  { item: 12, count: 1, cost: { 7: 3, 9: 2 }, name: "Bakır Kazma" }
];

function toggleInventoryModal() {
  const modal = document.getElementById("inventory-modal");
  const isVisible = modal.style.display === "block";
  modal.style.display = isVisible ? "none" : "block";
  if (!isVisible) buildInventoryUI();
}

canvas.onclick = e => {
  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;
  let drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, camX - viewW / 2));
  let drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, camY - viewH / 2));

  let clickX = (e.clientX / ZOOM) + drawCamX;
  let clickY = (e.clientY / ZOOM) + drawCamY;
  let tx = Math.floor(clickX / TILE_SIZE);
  let ty = Math.floor(clickY / TILE_SIZE);

  if (tx >= 0 && tx < MAP_W && ty >= 0 && ty < MAP_H) {
    if (world[ty][tx] !== 0) {
      let mined = world[ty][tx];
      world[ty][tx] = 0;
      addPlayerItem(mined, 1);
    }
  }
};

function loop() {
  updatePhysics();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
