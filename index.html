<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Solo World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #65b6e8; font-family: sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 12px; left: 12px; color: #fff; text-shadow: 2px 2px 3px #000; font-weight: bold; font-size: 15px; pointer-events: none; }
    #hotbar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
    .slot { width: 44px; height: 44px; border: 2px solid #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(255,255,255,0.1); cursor: pointer; }
    .slot.sel { border-color: #fff; background: rgba(255,255,255,0.3); transform: scale(1.05); }
    .slot i { width: 24px; height: 24px; border-radius: 3px; display: block; }
    .slot b { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fff; text-shadow: 1px 1px 2px #000; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="ui">
    <div id="stats">❤️ 20/20 | 🍗 20/20</div>
    <div style="font-size:12px; margin-top:5px; opacity:0.9;">
      [A/D] Hareket | [W / Space] Zıpla | [Sol Tık] Kır | [Sağ Tık] Koy | [1-5] Seçim
    </div>
  </div>
  <div id="hotbar"></div>

<script>
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

const BLOCK_SIZE = 32;
const MAP_W = 150, MAP_H = 60;

const B = {
  0: { name: "air", solid: 0, color: "transparent" },
  1: { name: "grass", solid: 1, color: "#55a832" },
  2: { name: "dirt", solid: 1, color: "#795548" },
  3: { name: "stone", solid: 1, color: "#607d8b" },
  4: { name: "wood", solid: 1, color: "#8d5524" },
  5: { name: "leaves", solid: 0, color: "#2e7d32" }
};

let world = [];
for(let y = 0; y < MAP_H; y++) {
  world[y] = [];
  for(let x = 0; x < MAP_W; x++) {
    if(y < 20) world[y][x] = 0;
    else if(y === 20) world[y][x] = 1;
    else if(y < 26) world[y][x] = 2;
    else world[y][x] = 3;
  }
}

// Ağaçlar Oluşturuluyor
for(let x = 10; x < MAP_W - 10; x += 12) {
  for(let h = 1; h <= 4; h++) world[20 - h][x] = 4;
  for(let lx = -1; lx <= 1; lx++) {
    for(let ly = -6; ly <= -5; ly++) {
      if(x + lx >= 0 && x + lx < MAP_W) world[20 + ly][x + lx] = 5;
    }
  }
}

let player = {
  x: 15 * BLOCK_SIZE,
  y: 18 * BLOCK_SIZE,
  w: 22,
  h: 52,
  vx: 0,
  vy: 0,
  grounded: false,
  sel: 0
};

const inv = { 1: 20, 2: 10, 3: 10, 4: 8 };
const slots = [1, 2, 3, 4];
const keys = {};

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if("1234".includes(e.key)) player.sel = +e.key - 1;
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function isSolid(px, py) {
  let bx = Math.floor(px / BLOCK_SIZE);
  let by = Math.floor(py / BLOCK_SIZE);
  if(bx < 0 || bx >= MAP_W || by < 0 || by >= MAP_H) return 1;
  return B[world[by][bx]].solid;
}

function update() {
  if(keys["a"] || keys["arrowleft"]) player.vx = -3.8;
  else if(keys["d"] || keys["arrowright"]) player.vx = 3.8;
  else player.vx *= 0.8;

  if((keys["w"] || keys[" "] || keys["arrowup"]) && player.grounded) {
    player.vy = -9.5;
    player.grounded = false;
  }

  player.vy += 0.48; // Yerçekimi

  // X Yatay Çarpışma
  player.x += player.vx;
  if(player.vx > 0 && (isSolid(player.x + player.w, player.y) || isSolid(player.x + player.w, player.y + player.h - 2))) {
    player.x = Math.floor((player.x + player.w) / BLOCK_SIZE) * BLOCK_SIZE - player.w - 0.1;
  }
  if(player.vx < 0 && (isSolid(player.x, player.y) || isSolid(player.x, player.y + player.h - 2))) {
    player.x = Math.floor(player.x / BLOCK_SIZE + 1) * BLOCK_SIZE + 0.1;
  }

  // Y Dikey Çarpışma
  player.y += player.vy;
  player.grounded = false;
  if(player.vy > 0 && (isSolid(player.x + 2, player.y + player.h) || isSolid(player.x + player.w - 2, player.y + player.h))) {
    player.y = Math.floor((player.y + player.h) / BLOCK_SIZE) * BLOCK_SIZE - player.h;
    player.vy = 0;
    player.grounded = true;
  }
}

function draw() {
  let camX = player.x - cv.width / 2;
  let camY = player.y - cv.height / 2;

  ctx.fillStyle = "#65b6e8";
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Blok Çizimi
  let startX = Math.max(0, Math.floor(camX / BLOCK_SIZE));
  let endX = Math.min(MAP_W, Math.ceil((camX + cv.width) / BLOCK_SIZE));
  let startY = Math.max(0, Math.floor(camY / BLOCK_SIZE));
  let endY = Math.min(MAP_H, Math.ceil((camY + cv.height) / BLOCK_SIZE));

  for(let y = startY; y < endY; y++) {
    for(let x = startX; x < endX; x++) {
      let tile = world[y][x];
      if(tile !== 0) {
        ctx.fillStyle = B[tile].color;
        let screenX = x * BLOCK_SIZE - camX;
        let screenY = y * BLOCK_SIZE - camY;
        ctx.fillRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.strokeRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
      }
    }
  }

  // Karakter Çizimi
  let px = player.x - camX, py = player.y - camY;
  ctx.fillStyle = "#2b5c8f"; ctx.fillRect(px, py + 18, player.w, player.h - 18); // Gövde
  ctx.fillStyle = "#dcb083"; ctx.fillRect(px + 2, py, player.w - 4, 18); // Kafa

  renderBar();
}

function renderBar() {
  let h = document.getElementById("hotbar"); h.innerHTML = "";
  slots.forEach((id, i) => {
    let d = document.createElement("div");
    d.className = "slot" + (i === player.sel ? " sel" : "");
    d.onclick = () => player.sel = i;
    d.innerHTML = `<i style="background:${B[id].color}"></i><b>${inv[id] || 0}</b>`;
    h.appendChild(d);
  });
}

cv.onmousedown = e => {
  let camX = player.x - cv.width / 2;
  let camY = player.y - cv.height / 2;
  let tx = Math.floor((e.clientX + camX) / BLOCK_SIZE);
  let ty = Math.floor((e.clientY + camY) / BLOCK_SIZE);

  // Mesafe Kontrolü (Çok uzaktaki bloğu kıramaz)
  let dist = Math.hypot(tx * BLOCK_SIZE - player.x, ty * BLOCK_SIZE - player.y);
  if(dist > BLOCK_SIZE * 7) return;

  if(e.button === 0 && world[ty]?.[tx] !== 0) { // Sol Tık: Kır
    let t = world[ty][tx];
    world[ty][tx] = 0;
    inv[t] = (inv[t] || 0) + 1;
  } else if(e.button === 2) { // Sağ Tık: Koy
    let id = slots[player.sel];
    if((inv[id] || 0) > 0 && world[ty]?.[tx] === 0) {
      world[ty][tx] = id;
      inv[id]--;
    }
  }
};
cv.oncontextmenu = e => e.preventDefault();

(function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
