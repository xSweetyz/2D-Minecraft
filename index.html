<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Solo World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #65b6e8; font-family: sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 2px 2px 2px #000; font-size: 16px; font-weight: bold; pointer-events: none; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="ui">❤️ 20/20 | 🍗 20/20</div>

<script>
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

const BLOCK_SIZE = 40;
const MAP_W = 100, MAP_H = 50;

// Dünya Oluşturma
let world = [];
for(let y = 0; y < MAP_H; y++) {
  world[y] = [];
  for(let x = 0; x < MAP_W; x++) {
    if(y < 15) world[y][x] = 0;       // Gökyüzü (Hava)
    else if(y === 15) world[y][x] = 1; // Çimen (Zemin)
    else if(y < 20) world[y][x] = 2;  // Toprak
    else world[y][x] = 3;             // Taş
  }
}

// Oyuncu (Zeminin tam üzerine koyuldu: X=10, Y=13)
let player = { x: 10 * BLOCK_SIZE, y: 13 * BLOCK_SIZE, w: 28, h: 56, vx: 0, vy: 0, grounded: false };
let keys = {};

addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function update() {
  // Sol-Sağ Hareket
  if(keys["a"] || keys["arrowleft"]) player.vx = -4;
  else if(keys["d"] || keys["arrowright"]) player.vx = 4;
  else player.vx = 0;

  // Zıplama
  if((keys["w"] || keys[" "] || keys["arrowup"]) && player.grounded) {
    player.vy = -10;
    player.grounded = false;
  }

  // Yerçekimi
  player.vy += 0.5;

  // Pozisyon Güncelleme
  player.x += player.vx;
  player.y += player.vy;

  // Basit Zemin Çarpışması (Y=15 blok seviyesi)
  let groundY = 15 * BLOCK_SIZE - player.h;
  if(player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.grounded = true;
  }
}

function draw() {
  // Kamera Merkezleme (Oyuncuyu ekranın ortasında tutar)
  let camX = player.x - cv.width / 2;
  let camY = player.y - cv.height / 2;

  // Gökyüzü Arka Planı
  ctx.fillStyle = "#65b6e8";
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Blokları Çiz
  for(let y = 0; y < MAP_H; y++) {
    for(let x = 0; x < MAP_W; x++) {
      let tile = world[y][x];
      if(tile !== 0) {
        if(tile === 1) ctx.fillStyle = "#55a832"; // Çimen
        else if(tile === 2) ctx.fillStyle = "#795548"; // Toprak
        else if(tile === 3) ctx.fillStyle = "#607d8b"; // Taş

        let screenX = x * BLOCK_SIZE - camX;
        let screenY = y * BLOCK_SIZE - camY;

        ctx.fillRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.strokeRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
      }
    }
  }

  // Oyuncuyu Çiz (Kırmızı Karakter)
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(player.x - camX, player.y - camY, player.w, player.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
