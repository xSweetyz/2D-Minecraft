<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Survival Revolution</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* HUD & Bilgilendirme */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 14px;
    }
    .controls-hint {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }
    
    /* Hotbar - Tam 5 Slot */
    #hotbar-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .slot {
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slot:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .slot.sel {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transform: translateY(-4px);
    }
    .slot canvas {
      width: 40px;
      height: 40px;
    }
    .slot b {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 11px;
      color: #f8fafc;
      text-shadow: 0 1px 2px #000;
    }
    .slot .key-num {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 10px;
      color: #64748b;
      font-weight: bold;
    }

    /* Envanter & Crafting Modal (E Tuşu) */
    #inventory-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      z-index: 20;
      color: #f8fafc;
    }
    #inventory-modal h2 {
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .inv-section {
      margin-bottom: 16px;
    }
    .inv-section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .recipe-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .recipe-card:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .recipe-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .craft-btn {
      background: #0284c7;
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="ui">
    <div class="hud-card">
      <span id="health-display">❤️ 100 / 100</span>
      <span style="opacity: 0.3;">|</span>
      <span id="time-display">☀️ Gündüz</span>
    </div>
    <div class="controls-hint">
      [A/D] Yürü (Geceyi İlerletir) | [W/Space] Zıpla (Sabah Yapar) | [E] Envanter & Üretim | [Sol Tık] Kır | [Sağ Tık] Koy
    </div>
  </div>

  <div id="hotbar-wrapper"></div>

  <div id="inventory-modal">
    <h2>ENVANTER & CRAFTING</h2>
    <div class="inv-section">
      <div class="inv-section-title">Depolanan Kaynaklar</div>
      <div class="inv-grid" id="inv-grid"></div>
    </div>
    <div class="inv-section">
      <div class="inv-section-title">Üretilebilir Eşyalar</div>
      <div class="recipe-list" id="recipe-list"></div>
    </div>
  </div>

<script>
// ==========================================
// 1. ENGINE & CANVAS KURULUMU
// ==========================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const TILE_SIZE = 36;
const MAP_W = 300;
const MAP_H = 100;

// ==========================================
// 2. TANIMLAMALAR VE NESNE TİPLERİ
// ==========================================
const ITEM_TYPES = {
  0: { name: "Hava", solid: false },
  1: { name: "Çimen", solid: true, time: 40, color: "#4ade80", darkColor: "#15803d" },
  2: { name: "Toprak", solid: true, time: 50, color: "#854d0e", darkColor: "#713f12" },
  3: { name: "Taş", solid: true, time: 180, needTool: true, color: "#64748b", darkColor: "#475569" },
  4: { name: "Ağaç Gövdesi", solid: true, time: 120, color: "#b45309", darkColor: "#78350f" },
  5: { name: "Yaprak", solid: false, time: 20, color: "#22c55e", darkColor: "#16a34a" },
  6: { name: "Kömür Cevheri", solid: true, time: 240, needTool: true, color: "#334155", darkColor: "#1e293b" },
  7: { name: "Bakır Cevheri", solid: true, time: 300, needTool: true, color: "#f97316", darkColor: "#c2410c" },
  8: { name: "Ahşap Blok", solid: true, time: 80, color: "#d97706", darkColor: "#92400e" },
  9: { name: "Ahşap Çubuk", solid: false, isItem: true, color: "#78350f" },
  10: { name: "Tahta Kazma", solid: false, isTool: true, speed: 3.5, color: "#d97706" },
  11: { name: "Taş Kazma", solid: false, isTool: true, speed: 7.0, color: "#94a3b8" }
};

// ==========================================
// 3. DÜNYA VE ZAMAN SİSTEMİ
// ==========================================
let world = [];
let surfaceY = 32;

function initWorld() {
  world = [];
  for (let y = 0; y < MAP_H; y++) {
    world[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 4 + Math.cos(x * 0.03) * 2);
      if (y < curSurface) {
        world[y][x] = 0;
      } else if (y === curSurface) {
        world[y][x] = 1;
      } else if (y < curSurface + 8) {
        world[y][x] = 2;
      } else {
        let r = Math.random();
        if (r < 0.04) world[y][x] = 6;
        else if (r < 0.07) world[y][x] = 7;
        else world[y][x] = 3;
      }
    }
  }

  // Ağaçlar
  for (let x = 10; x < MAP_W - 10; x += Math.floor(Math.random() * 6) + 6) {
    if (Math.random() > 0.3) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 4 + Math.cos(x * 0.03) * 2);
      let treeH = Math.floor(Math.random() * 3) + 4;
      for (let h = 1; h <= treeH; h++) {
        if (curSurface - h >= 0) world[curSurface - h][x] = 4;
      }
      let top = curSurface - treeH;
      for (let lx = -2; lx <= 2; lx++) {
        for (let ly = -3; ly <= -1; ly++) {
          if (world[top + ly] && world[top + ly][x + lx] === 0) {
            world[top + ly][x + lx] = 5;
          }
        }
      }
    }
  }
}
initWorld();

// Zaman Döngüsü (0: Gündüz, 1: Gece)
let timeOfDay = 0; // 0.0 - 1.0
function updateTime(amount) {
  timeOfDay = (timeOfDay + amount) % 1.0;
  const timeText = document.getElementById("time-display");
  if (timeOfDay < 0.5) {
    timeText.innerText = "☀️ Gündüz";
  } else {
    timeText.innerText = "🌙 Gece";
  }
}

// ==========================================
// 4. OYUNCU & SADECE 5 SLOTLU ENVANTER
// ==========================================
let player = {
  x: 20 * TILE_SIZE,
  y: (surfaceY - 4) * TILE_SIZE,
  w: 22,
  h: 48,
  vx: 0,
  vy: 0,
  grounded: false,
  selectedSlot: 0,
  animFrame: 0,
  isMoving: false
};

// Sadece 5 Slotlu Hotbar
const hotbar = [0, 0, 0, 0, 0]; // Başlangıçta hepsi boş
const inventoryStorage = { 1: 0, 2: 0, 3: 0, 4: 0, 8: 0, 9: 0, 10: 0, 11: 0 };
const keys = {};

let particles = [];
let mining = { active: false, x: -1, y: -1, progress: 0 };

// Tuş Kontrolleri
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;

  if ("12345".includes(e.key)) {
    player.selectedSlot = parseInt(e.key) - 1;
  }

  // W veya Space ile Zıplayınca -> SABAH OLSUN
  if ((k === "w" || k === " ") && player.grounded) {
    player.vy = -11.0;
    player.grounded = false;
    timeOfDay = 0.0; // Sabah yap
    updateTime(0);
  }

  if (k === "e") {
    toggleInventoryModal();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// Partikül Efektleri (Kırma & Koyma için)
function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 4 + 2,
      color: color,
      life: 1.0
    });
  }
}

// ==========================================
// 5. OYUN FİZİĞİ & GÜNCELLEME
// ==========================================
function isSolidBlock(px, py) {
  let tx = Math.floor(px / TILE_SIZE);
  let ty = Math.floor(py / TILE_SIZE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return ITEM_TYPES[world[ty][tx]].solid;
}

function updatePhysics() {
  player.isMoving = false;

  // A veya D ile Yürürken -> GECEYE İLERLESİN
  if (keys["a"] || keys["arrowleft"]) {
    player.vx = -4.0;
    player.isMoving = true;
    updateTime(0.0008); // Yürürken zaman yavaşça geceye kayar
  } else if (keys["d"] || keys["arrowright"]) {
    player.vx = 4.0;
    player.isMoving = true;
    updateTime(0.0008);
  } else {
    player.vx *= 0.7;
  }

  player.vy += 0.55; // Yerçekimi

  if (player.isMoving && player.grounded) player.animFrame += 0.2;
  else player.animFrame = 0;

  // Yatay Çarpışma Testi
  player.x += player.vx;
  if (player.vx > 0 && (isSolidBlock(player.x + player.w, player.y) || isSolidBlock(player.x + player.w, player.y + player.h - 2))) {
    player.x = Math.floor((player.x + player.w) / TILE_SIZE) * TILE_SIZE - player.w - 0.1;
  }
  if (player.vx < 0 && (isSolidBlock(player.x, player.y) || isSolidBlock(player.x, player.y + player.h - 2))) {
    player.x = Math.floor(player.x / TILE_SIZE + 1) * TILE_SIZE + 0.1;
  }

  // Dikey Çarpışma Testi
  player.y += player.vy;
  player.grounded = false;
  if (player.vy > 0 && (isSolidBlock(player.x + 2, player.y + player.h) || isSolidBlock(player.x + player.w - 2, player.y + player.h))) {
    player.y = Math.floor((player.y + player.h) / TILE_SIZE) * TILE_SIZE - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  // Blok Kırma Hesabı
  if (mining.active) {
    let activeItem = hotbar[player.selectedSlot];
    let speed = ITEM_TYPES[activeItem]?.speed || 1.0;
    let target = world[mining.y]?.[mining.x];

    if (target && target !== 0) {
      if (ITEM_TYPES[target].needTool && !ITEM_TYPES[activeItem]?.isTool) {
        mining.progress = 0; // Kazmasız taş/maden kırılamaz
      } else {
        mining.progress += speed;
        spawnParticles(mining.x * TILE_SIZE + TILE_SIZE/2, mining.y * TILE_SIZE + TILE_SIZE/2, ITEM_TYPES[target].color);
        if (mining.progress >= ITEM_TYPES[target].time) {
          inventoryStorage[target] = (inventoryStorage[target] || 0) + 1;
          
          // Otomatik hotbar'a yerleştir (eğer boş slot varsa)
          autoAssignToHotbar(target);

          world[mining.y][mining.x] = 0;
          mining.active = false;
        }
      }
    } else {
      mining.active = false;
    }
  }

  // Partikül Güncelleme
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function autoAssignToHotbar(itemId) {
  // Eğer hotbar'da zaten varsa ekleme yapmaya gerek yok
  if (hotbar.includes(itemId)) return;
  // İlk boş slota koy
  for (let i = 0; i < 5; i++) {
    if (hotbar[i] === 0) {
      hotbar[i] = itemId;
      break;
    }
  }
}

// ==========================================
// 6. GELİŞMİŞ HD VEKTÖREL GRAFİKLER
// ==========================================
function renderTile(id, x, y, size, targetCtx = ctx) {
  if (!id || id === 0) return;

  const info = ITEM_TYPES[id];
  
  // Yuvarlatılmış Blok Çizimi (Modern HD Görünüm)
  targetCtx.fillStyle = info.color;
  targetCtx.beginPath();
  targetCtx.roundRect(x, y, size, size, 4);
  targetCtx.fill();

  // Gölgelendirme & Doku Detayları
  targetCtx.fillStyle = info.darkColor;
  if (id === 1) { // Çimen Tepesi
    targetCtx.beginPath();
    targetCtx.roundRect(x, y, size, 8, [4, 4, 0, 0]);
    targetCtx.fill();
  } else if (id === 2 || id === 3 || id === 6 || id === 7) { // Maden pürüzleri
    targetCtx.fillRect(x + 4, y + 4, 6, 6);
    targetCtx.fillRect(x + 18, y + 16, 8, 8);
  } else if (id === 4) { // Odun Çizgileri
    targetCtx.fillRect(x + 6, y, 4, size);
    targetCtx.fillRect(x + 22, y, 4, size);
  } else if (id === 10 || id === 11) { // Kazma Simgeleri
    targetCtx.fillRect(x + 4, y + 4, 24, 6);
    targetCtx.fillStyle = "#78350f";
    targetCtx.fillRect(x + 13, y + 10, 5, 18);
  }
}

function renderPlayerHD(screenX, screenY) {
  let anim = Math.sin(player.animFrame) * 6;

  // Gölge
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(screenX + 11, screenY + 46, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bacaklar
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(screenX + 3, screenY + 28, 6, 18 + anim);
  ctx.fillRect(screenX + 12, screenY + 28, 6, 18 - anim);

  // Gövde (Ceket/Kıyafet)
  ctx.fillStyle = "#0284c7";
  ctx.beginPath();
  ctx.roundRect(screenX + 2, screenY + 12, 17, 18, 4);
  ctx.fill();

  // Kollar
  ctx.fillStyle = "#f3d5b5";
  ctx.fillRect(screenX - 2, screenY + 12 - anim, 4, 14);
  ctx.fillRect(screenX + 19, screenY + 12 + anim, 4, 14);

  // Kafa
  ctx.fillStyle = "#f3d5b5";
  ctx.beginPath();
  ctx.roundRect(screenX + 2, screenY - 2, 17, 16, 4);
  ctx.fill();

  // Saç
  ctx.fillStyle = "#451a03";
  ctx.fillRect(screenX + 2, screenY - 2, 17, 5);

  // Gözler
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(screenX + 12, screenY + 4, 3, 4);
}

function render() {
  let camX = player.x - canvas.width / 2;
  let camY = player.y - canvas.height / 2;

  camX = Math.max(0, Math.min(MAP_W * TILE_SIZE - canvas.width, camX));
  camY = Math.max(0, Math.min(MAP_H * TILE_SIZE - canvas.height, camY));

  // Dinamik Gökyüzü Gradient (Gündüz / Gece)
  let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (timeOfDay < 0.5) { // Gündüz
    skyGrad.addColorStop(0, "#38bdf8");
    skyGrad.addColorStop(1, "#bae6fd");
  } else { // Gece
    skyGrad.addColorStop(0, "#020617");
    skyGrad.addColorStop(1, "#0f172a");
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Gece Yıldızları
  if (timeOfDay >= 0.5) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    for (let i = 0; i < 30; i++) {
      let starX = (i * 137) % canvas.width;
      let starY = (i * 93) % (canvas.height * 0.5);
      ctx.fillRect(starX, starY, 2, 2);
    }
  }

  // Harita Çizimi
  let startX = Math.max(0, Math.floor(camX / TILE_SIZE));
  let endX = Math.min(MAP_W, Math.ceil((camX + canvas.width) / TILE_SIZE));
  let startY = Math.max(0, Math.floor(camY / TILE_SIZE));
  let endY = Math.min(MAP_H, Math.ceil((camY + canvas.height) / TILE_SIZE));

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      let tile = world[y][x];
      if (tile !== 0) {
        renderTile(tile, x * TILE_SIZE - camX, y * TILE_SIZE - camY, TILE_SIZE);
      }
    }
  }

  // Partikülleri Çiz
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x - camX, p.y - camY, p.size, p.size);
    ctx.globalAlpha = 1.0;
  });

  // Kırma Efekti
  if (mining.active) {
    let bx = mining.x * TILE_SIZE - camX;
    let by = mining.y * TILE_SIZE - camY;
    let target = world[mining.y][mining.x];
    let ratio = mining.progress / ITEM_TYPES[target].time;

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, TILE_SIZE, TILE_SIZE);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(bx, by, TILE_SIZE * ratio, TILE_SIZE);
  }

  // Oyuncuyu Çiz
  renderPlayerHD(player.x - camX, player.y - camY);

  // Dinamik Işık Efekti (Oyuncu Etrafı Aydınlatması)
  let lightGrad = ctx.createRadialGradient(
    player.x - camX + 11, player.y - camY + 24, 20,
    player.x - camX + 11, player.y - camY + 24, 220
  );
  lightGrad.addColorStop(0, "rgba(255,255,255,0)");
  lightGrad.addColorStop(1, timeOfDay >= 0.5 ? "rgba(2, 6, 23, 0.75)" : "rgba(0,0,0,0)");
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  renderHotbarUI();
}

// ==========================================
// 7. SADECE 5 SLOTLU HOTBAR UI
// ==========================================
function renderHotbarUI() {
  const wrapper = document.getElementById("hotbar-wrapper");
  wrapper.innerHTML = "";

  for (let i = 0; i < 5; i++) {
    let itemKey = hotbar[i];
    let slot = document.createElement("div");
    slot.className = "slot" + (i === player.selectedSlot ? " sel" : "");
    slot.onclick = () => player.selectedSlot = i;

    let c = document.createElement("canvas");
    c.width = 40;
    c.height = 40;
    let cCtx = c.getContext("2d");

    if (itemKey && itemKey !== 0) {
      renderTile(itemKey, 4, 4, 32, cCtx);
    }

    slot.appendChild(c);
    slot.innerHTML += `<span class="key-num">${i + 1}</span>`;
    
    if (itemKey && !ITEM_TYPES[itemKey].isTool) {
      let count = inventoryStorage[itemKey] || 0;
      slot.innerHTML += `<b>${count}</b>`;
    }

    wrapper.appendChild(slot);
  }
}

// ==========================================
// 8. ENVANTER VE CRAFTING PENCERESİ (E TUŞU)
// ==========================================
const craftingRecipes = [
  { item: 8, count: 4, cost: { 4: 1 }, name: "Ahşap Blok (4x)" },
  { item: 9, count: 4, cost: { 8: 2 }, name: "Ahşap Çubuk (4x)" },
  { item: 10, count: 1, cost: { 8: 3, 9: 2 }, name: "Tahta Kazma" },
  { item: 11, count: 1, cost: { 3: 3, 9: 2 }, name: "Taş Kazma" }
];

function toggleInventoryModal() {
  const modal = document.getElementById("inventory-modal");
  const isVisible = modal.style.display === "block";
  modal.style.display = isVisible ? "none" : "block";

  if (!isVisible) {
    // Depolanan Kaynakları Göster
    const invGrid = document.getElementById("inv-grid");
    invGrid.innerHTML = "";
    Object.keys(inventoryStorage).forEach(k => {
      let count = inventoryStorage[k];
      if (count > 0 || ITEM_TYPES[k].isTool) {
        let div = document.createElement("div");
        div.style.cssText = "background:rgba(30,41,59,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:6px; text-align:center; font-size:11px;";
        div.innerHTML = `<div>${ITEM_TYPES[k].name}</div><b>${count} Adet</b>`;
        invGrid.appendChild(div);
      }
    });

    // Crafting Tariflerini Listele
    const list = document.getElementById("recipe-list");
    list.innerHTML = "";
    craftingRecipes.forEach(r => {
      let canCraft = Object.keys(r.cost).every(k => (inventoryStorage[k] || 0) >= r.cost[k]);
      let card = document.createElement("div");
      card.className = "recipe-card" + (canCraft ? "" : " disabled");
      card.innerHTML = `<span>${r.name}</span><span class="craft-btn">${canCraft ? "ÜRET" : "Eksik"}</span>`;
      card.onclick = () => {
        if (canCraft) {
          Object.keys(r.cost).forEach(k => inventoryStorage[k] -= r.cost[k]);
          inventoryStorage[r.item] = (inventoryStorage[r.item] || 0) + r.count;
          autoAssignToHotbar(r.item);
          toggleInventoryModal();
        }
      };
      list.appendChild(card);
    });
  }
}

// ==========================================
// 9. FARE / ETKİLEŞİM
// ==========================================
canvas.onmousedown = e => {
  let camX = player.x - canvas.width / 2;
  let camY = player.y - canvas.height / 2;
  camX = Math.max(0, Math.min(MAP_W * TILE_SIZE - canvas.width, camX));
  camY = Math.max(0, Math.min(MAP_H * TILE_SIZE - canvas.height, camY));

  let tx = Math.floor((e.clientX + camX) / TILE_SIZE);
  let ty = Math.floor((e.clientY + camY) / TILE_SIZE);

  let dist = Math.hypot(tx * TILE_SIZE - player.x, ty * TILE_SIZE - player.y);
  if (dist > TILE_SIZE * 7) return;

  if (e.button === 0 && world[ty]?.[tx] !== 0) { // Sol Tık Kırma
    mining.active = true;
    mining.x = tx;
    mining.y = ty;
    mining.progress = 0;
  } else if (e.button === 2) { // Sağ Tık Koyma
    let activeItem = hotbar[player.selectedSlot];
    if (activeItem && !ITEM_TYPES[activeItem].isTool && !ITEM_TYPES[activeItem].isItem && (inventoryStorage[activeItem] || 0) > 0 && world[ty]?.[tx] === 0) {
      world[ty][tx] = activeItem;
      inventoryStorage[activeItem]--;
      spawnParticles(tx * TILE_SIZE + TILE_SIZE/2, ty * TILE_SIZE + TILE_SIZE/2, ITEM_TYPES[activeItem].color);
    }
  }
};

canvas.onmouseup = () => mining.active = false;
canvas.oncontextmenu = e => e.preventDefault();

// ==========================================
// 10. ANA DÖNGÜ (60 FPS)
// ==========================================
function loop() {
  updatePhysics();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
