<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Solo World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #65b6e8; font-family: sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 2px 2px 2px #000; font-weight: bold; pointer-events: none; }
    #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 6px; }
    .slot { width: 40px; height: 40px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(255,255,255,0.1); cursor: pointer; }
    .slot.sel { border-color: #fff; background: rgba(255,255,255,0.3); }
    .slot i { width: 20px; height: 20px; }
    .slot b { position: absolute; bottom: 2px; right: 2px; font-size: 10px; color: #fff; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="ui">❤️ 20/20 | 🍗 20/20</div>
  <div id="hotbar"></div>

<script>
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

const T = 32, W = 100, H = 60;
const B = {
  air:{s:0,c:"transparent"}, grass:{s:1,c:"#62a63d"}, dirt:{s:1,c:"#8a5a31"}, stone:{s:1,c:"#777"}, wood:{s:1,c:"#86572b"}
};

let world = Array.from({length: H}, () => Array(W).fill("air"));

// Garanti Zemin Oluşturma (Y=20'den itibaren toprak)
for(let x = 0; x < W; x++) {
  for(let y = 20; y < H; y++) {
    if(y === 20) world[y][x] = "grass";
    else if(y < 25) world[y][x] = "dirt";
    else world[y][x] = "stone";
  }
}

// Oyuncuyu tam zemine oturtuyoruz (Y=18.2)
const p = { x: 10, y: 18.2, vx: 0, vy: 0, w: 0.8, h: 1.8, g: 0, sel: 0 };
const inv = { grass: 20, dirt: 10, stone: 10, wood: 5 };
const slots = ["grass", "dirt", "stone", "wood"];
const keys = {};

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = 1;
  if("1234".includes(e.key)) p.sel = +e.key - 1;
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = 0);

function solid(x, y) {
  let bx = Math.floor(x), by = Math.floor(y);
  if(bx < 0 || by < 0 || bx >= W || by >= H) return 1;
  return B[world[by][bx]].s;
}

function physics() {
  let l = keys.a || keys.arrowleft, r = keys.d || keys.arrowright, j = keys.w || keys.arrowup || keys[" "];
  p.vx += (r - l) * 0.04; p.vx *= 0.75;
  p.vy += 0.015;
  if(j && p.g) { p.vy = -0.28; p.g = 0; }
  
  p.x += p.vx;
  p.y += p.vy; p.g = 0;

  if(p.vy > 0 && (solid(p.x, p.y + p.h) || solid(p.x + p.w, p.y + p.h))) {
    p.y = Math.floor(p.y + p.h) - p.h;
    p.vy = 0; p.g = 1;
  }
}

function render() {
  // Kamera Oyuncuyu Takip Eder
  let cx = p.x * T - cv.width / 2;
  let cy = p.y * T - cv.height / 2;

  ctx.fillStyle = "#65b6e8";
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Blokları Çiz
  for(let y = 0; y < H; y++) {
    for(let x = 0; x < W; x++) {
      let t = world[y][x];
      if(t !== "air") {
        ctx.fillStyle = B[t].c;
        ctx.fillRect(x * T - cx, y * T - cy, T, T);
      }
    }
  }

  // Oyuncuyu Çiz (Kırmızı Karakter)
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(p.x * T - cx, p.y * T - cy, p.w * T, p.h * T);

  // Envanter Barı
  let h = document.getElementById("hotbar"); h.innerHTML = "";
  slots.forEach((it, i) => {
    let d = document.createElement("div");
    d.className = "slot" + (i === p.sel ? " sel" : "");
    d.innerHTML = `<i style="background:${B[it].c}"></i><b>${inv[it]||0}</b>`;
    h.appendChild(d);
  });
}

cv.onmousedown = e => {
  let cx = p.x * T - cv.width / 2;
  let cy = p.y * T - cv.height / 2;
  let tx = Math.floor((e.clientX + cx) / T);
  let ty = Math.floor((e.clientY + cy) / T);

  if(e.button === 0 && world[ty]?.[tx] !== "air") {
    let t = world[ty][tx];
    world[ty][tx] = "air";
    inv[t] = (inv[t] || 0) + 1;
  } else if(e.button === 2) {
    let it = slots[p.sel];
    if((inv[it] || 0) > 0 && world[ty]?.[tx] === "air") {
      world[ty][tx] = it;
      inv[it]--;
    }
  }
};
cv.oncontextmenu = e => e.preventDefault();

(function loop() {
  physics();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
