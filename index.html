<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Terraria Solo World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #65b6e8; font-family: sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 12px; left: 12px; color: #fff; text-shadow: 2px 2px 3px #000; font-weight: bold; font-size: 15px; pointer-events: none; }
    #hotbar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
    .slot { width: 44px; height: 44px; border: 2px solid #555; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(255,255,255,0.1); cursor: pointer; }
    .slot.sel { border-color: #fff; background: rgba(255,255,255,0.3); transform: scale(1.05); }
    .slot i { width: 26px; height: 26px; border-radius: 3px; display: block; }
    .slot b { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fff; text-shadow: 1px 1px 2px #000; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="ui">
    <div id="stats">❤️ 20/20 | 🍗 20/20</div>
    <div style="font-size:12px; margin-top:5px; opacity:0.9;">
      [A / D] Hareket | [W / Space] Zıpla | [Sol Tık] Kır | [Sağ Tık] Koy | [1-5] Seçim
    </div>
  </div>
  <div id="hotbar"></div>

<script>
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

const T = 32, W = 260, H = 100;
const B = {
  air:{s:0,c:"transparent"}, grass:{s:1,c:"#62a63d"}, dirt:{s:1,c:"#8a5a31"},
  stone:{s:1,c:"#777"}, coal:{s:1,c:"#3d3d3d"}, iron:{s:1,c:"#b58a67"},
  diamond:{s:1,c:"#36e6e6"}, wood:{s:1,c:"#86572b"}, leaves:{s:0,c:"#3d8d3a"}, plank:{s:1,c:"#b27a42"}
};

let world = Array.from({length: H}, () => Array(W).fill("air"));

// Sabit ve Garantili Dünya Yapısı (Zemin Y=30)
function generateWorld() {
  for(let x = 0; x < W; x++) {
    for(let y = 30; y < H; y++) {
      if(y === 30) world[y][x] = "grass";
      else if(y < 35) world[y][x] = "dirt";
      else world[y][x] = Math.random() < 0.1 ? "coal" : "stone";
    }
    // Ağaçlar
    if(x % 8 === 0) {
      for(let t = 1; t <= 4; t++) world[30 - t][x] = "wood";
      for(let dx = -1; dx <= 1; dx++) {
        for(let dy = -6; dy <= -4; dy++) {
          if(x + dx >= 0 && x + dx < W) world[30 + dy][x + dx] = "leaves";
        }
      }
    }
  }
}
generateWorld();

// Oyuncuyu tam zeminin üzerine (Y=28) yerleştiriyoruz
const p = { x: 25.5, y: 28, vx: 0, vy: 0, w: 0.7, h: 1.8, g: 0, hp: 20, hunger: 20, sel: 0 };
const inv = { grass: 20, dirt: 10, stone: 10, wood: 8, plank: 4 };
const slots = ["grass", "dirt", "stone", "wood", "plank"];
const keys = {};

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = 1;
  if("12345".includes(e.key)) p.sel = +e.key - 1;
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = 0);

function solid(x, y) {
  let bx = Math.floor(x), by = Math.floor(y);
  if(bx < 0 || by < 0 || bx >= W || by >= H) return 1;
  return B[world[by][bx]].s;
}

function physics() {
  let l = keys.a || keys.arrowleft, r = keys.d || keys.arrowright, j = keys.w || keys.arrowup || keys[" "];
  p.vx += (r - l) * 0.03; p.vx *= 0.8;
  p.vy += 0.015;
  if(j && p.g) { p.vy = -0.28; p.g = 0; }
  
  p.x += p.vx;
  if(p.vx > 0 && (solid(p.x + 0.35, p.y) || solid(p.x + 0.35, p.y + p.h - 0.1))) p.x = Math.floor(p.x + 0.35) - 0.36;
  if(p.vx < 0 && (solid(p.x - 0.35, p.y) || solid(p.x - 0.35, p.y + p.h - 0.1))) p.x = Math.floor(p.x - 0.35) + 1.36;
  
  p.y += p.vy; p.g = 0;
  if(p.vy > 0 && (solid(p.x - 0.3, p.y + p.h) || solid(p.x + 0.3, p.y + p.h))) {
    p.y = Math.floor(p.y + p.h) - p.h; p.vy = 0; p.g = 1;
  }
}

function cam() {
  return {
    x: Math.max(0, Math.min(W * T - cv.width, p.x * T - cv.width / 2)),
    y: Math.max(0, Math.min(H * T - cv.height, p.y * T - cv.height / 2))
  };
}

function render() {
  let c = cam();
  let g = ctx.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, "#65b6e8"); g.addColorStop(1, "#c9ecff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

  let sx = Math.floor(c.x / T), ex = Math.min(W, sx + Math.ceil(cv.width / T) + 2);
  let sy = Math.floor(c.y / T), ey = Math.min(H, sy + Math.ceil(cv.height / T) + 2);

  for(let y = sy; y < ey; y++) {
    for(let x = sx; x < ex; x++) {
      let t = world[y][x];
      if(t !== "air") {
        ctx.fillStyle = B[t].c;
        ctx.fillRect(x * T - c.x, y * T - c.y, T, T);
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.strokeRect(x * T - c.x, y * T - c.y, T, T);
      }
    }
  }

  // Karakter Çizimi
  let px = p.x * T - c.x, py = p.y * T - c.y;
  ctx.fillStyle = "#3a79b7"; ctx.fillRect(px - 10, py, 20, 35); // Gövde
  ctx.fillStyle = "#c58a62"; ctx.fillRect(px - 8, py - 16, 16, 16); // Baş

  renderBar();
}

function renderBar() {
  let h = document.getElementById("hotbar"); h.innerHTML = "";
  slots.forEach((it, i) => {
    let d = document.createElement("div");
    d.className = "slot" + (i === p.sel ? " sel" : "");
    d.onclick = () => p.sel = i;
    d.innerHTML = `<i style="background:${B[it].c}"></i><b>${inv[it] || 0}</b>`;
    h.appendChild(d);
  });
}

cv.onmousedown = e => {
  let c = cam();
  let tx = Math.floor((e.clientX + c.x) / T);
  let ty = Math.floor((e.clientY + c.y) / T);
  if(Math.hypot(tx - p.x, ty - p.y) > 7) return;

  if(e.button === 0 && world[ty][tx] !== "air") {
    let t = world[ty][tx];
    world[ty][tx] = "air";
    inv[t] = (inv[t] || 0) + 1;
  } else if(e.button === 2) {
    let it = slots[p.sel];
    if((inv[it] || 0) > 0 && world[ty][tx] === "air") {
      world[ty][tx] = it;
      inv[it]--;
    }
  }
};
cv.oncontextmenu = e => e.preventDefault();

(function loop() {
  physics();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
