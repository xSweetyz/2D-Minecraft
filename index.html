<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terraria 2D Survival Edition - Kusursuz Sürüm</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 12px;
    }
    .controls-hint {
      font-size: 11px;
      color: #cbd5e1;
      text-shadow: 1px 1px 2px #000;
    }

    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 15px;
      justify-content: space-between;
      z-index: 1500;
      pointer-events: none;
    }
    .touch-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 70px;
      height: 70px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(56, 189, 248, 0.6);
      border-radius: 50%;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      outline: none;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(56, 189, 248, 0.5);
      transform: scale(0.92);
    }
    .touch-btn.place-mode {
      border-color: #f59e0b;
      background: rgba(120, 53, 15, 0.8);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
    }

    #mobile-hotbar-container {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 1400;
      pointer-events: auto;
    }

    #fullscreen-btn, #reset-btn {
      position: absolute;
      top: 10px;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(56, 189, 248, 0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
    }
    #fullscreen-btn { right: 10px; }
    #reset-btn { right: 115px; border-color: rgba(239, 68, 68, 0.6); background: rgba(127, 29, 29, 0.6); }

    .modal-close-x {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 32px;
      height: 32px;
      background: #ef4444;
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 3000;
    }

    #inventory-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 40px 15px 15px 15px;
      width: 95%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      pointer-events: auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.95);
      z-index: 2500;
      color: #fff;
    }
    #inventory-modal h2 {
      font-size: 15px;
      color: #38bdf8;
      margin-bottom: 10px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }
    .section-title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .inventory-container {
      display: flex;
      gap: 10px;
    }
    .main-inv-area {
      flex: 1;
    }
    .armor-equip-area {
      width: 55px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 10px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .inv-slot {
      width: 44px;
      height: 44px;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
      touch-action: manipulation;
      pointer-events: auto;
    }
    .inv-slot:active { cursor: grabbing; }
    .inv-slot canvas { width: 28px; height: 28px; image-rendering: pixelated; pointer-events: none; }
    .inv-slot b {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 10px;
      color: #fff;
      text-shadow: 1px 1px #000;
      pointer-events: none;
    }

    #tooltip {
      display: none;
      position: fixed;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      z-index: 3500;
      white-space: nowrap;
    }

    .quick-craft-panel {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 120px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .recipe-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
    }
    .recipe-card button {
      background: #0284c7;
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .recipe-card button:active { background: #0369a1; }

    #hotbar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      z-index: 10;
      pointer-events: auto;
    }
    .hotbar-slot {
      width: 44px;
      height: 44px;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hotbar-slot.selected {
      border-color: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }
    .hotbar-slot canvas { width: 28px; height: 28px; image-rendering: pixelated; pointer-events: none; }
    .hotbar-slot b {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 10px;
      color: #fff;
      text-shadow: 1px 1px #000;
      pointer-events: none;
    }

    #death-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(127, 29, 29, 0.85);
      backdrop-filter: blur(10px);
      z-index: 4000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    #death-screen h1 { font-size: 32px; color: #f87171; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    #death-screen button {
      background: #ef4444;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <button id="fullscreen-btn">Tam Ekran</button>
  <button id="reset-btn">Sıfırla</button>

  <div id="ui">
    <div class="hud-card" id="health-card">Can: <span id="health-val">100</span>/100</div>
    <div class="hud-card" id="time-card">Zaman: <span id="time-val">Gündüz</span></div>
    <div class="controls-hint" id="desktop-hints">Kontroller: A/D - Yürü | W/Boşluk - Zıpla | Sol Tık - Kaz/Vur | Sağ Tık - Blok Koy | E - Envanter</div>
  </div>

  <div id="mobile-hotbar-container"></div>
  <div id="hotbar"></div>

  <div id="mobile-controls">
    <div class="touch-group">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn" id="btn-jump">▲</button>
      <button class="touch-btn" id="btn-action">⛏</button>
      <button class="touch-btn" id="btn-inv">🎒</button>
    </div>
  </div>

  <div id="inventory-modal">
    <div class="modal-close-x" id="close-inv-btn">✕</div>
    <h2>Envanter & Ekipman</h2>
    <div class="inventory-container">
      <div class="main-inv-area">
        <div class="section-title">Ana Envanter</div>
        <div class="inv-grid" id="main-inventory-grid"></div>
      </div>
      <div class="armor-equip-area">
        <div class="section-title">Zırh</div>
        <div class="inv-slot" data-armor="helmet" title="Kask"></div>
        <div class="inv-slot" data-armor="chest" title="Göğüslük"></div>
        <div class="inv-slot" data-armor="legs" title="Pantolon"></div>
        <div class="section-title" style="margin-top:6px;">Aksesuar</div>
        <div class="inv-slot" data-armor="acc" title="Aksesuar"></div>
      </div>
    </div>
    <div class="quick-craft-panel">
      <div class="section-title">Hızlı Üretim</div>
      <div class="recipe-list" id="recipe-list"></div>
    </div>
  </div>

  <div id="death-screen">
    <h1>YANDIN!</h1>
    <p style="margin-bottom:20px; font-size:14px;">Hayatta kalmayı başaramadın...</p>
    <button id="respawn-btn">Yeniden Doğ</button>
  </div>

  <div id="tooltip"></div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Telefonda daha geniş ve net görünüm için ZOOM ayarı optimize edildi
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const ZOOM = isMobile ? 2.5 : 3.0; 

    let WORLD_WIDTH = 250;
    let WORLD_HEIGHT = 120;
    let TILE_SIZE = 16;

    let blocks = [];
    let entities = [];
    let particles = [];
    let droppedItems = [];

    // Blok Tipleri
    const BLOCK_AIR = 0;
    const BLOCK_GRASS = 1;
    const BLOCK_DIRT = 2;
    const BLOCK_STONE = 3;
    const BLOCK_WOOD = 4;
    const BLOCK_LEAVES = 5;
    const BLOCK_IRON_ORE = 6;
    const BLOCK_GOLD_ORE = 7;
    const BLOCK_DIAMOND_ORE = 8;
    const BLOCK_WORKBENCH = 9;
    const BLOCK_FURNACE = 10;
    const BLOCK_TORCH = 11;
    const BLOCK_COPPER_ORE = 12;

    const blockNames = {
      0: "Hava", 1: "Çimen", 2: "Toprak", 3: "Taş", 4: "Odun", 5: "Yaprak",
      6: "Demir Cevheri", 7: "Altın Cevheri", 8: "Elmas Cevheri", 9: "Çalışma Masası",
      10: "Fırın", 11: "Meşale", 12: "Bakır Cevheri"
    };

    // Eşya Tanımları
    const itemsData = {
      1: { name: "Çimen Blok", type: "block", blockId: 1 },
      2: { name: "Toprak", type: "block", blockId: 2 },
      3: { name: "Taş", type: "block", blockId: 3 },
      4: { name: "Odun", type: "block", blockId: 4 },
      5: { name: "Yaprak", type: "block", blockId: 5 },
      6: { name: "Demir Cevheri", type: "block", blockId: 6 },
      7: { name: "Altın Cevheri", type: "block", blockId: 7 },
      8: { name: "Elmas Cevheri", type: "block", blockId: 8 },
      9: { name: "Çalışma Masası", type: "block", blockId: 9 },
      10: { name: "Fırın", type: "block", blockId: 10 },
      11: { name: "Meşale", type: "block", blockId: 11 },
      12: { name: "Bakır Cevheri", type: "block", blockId: 12 },
      // Çubuklar ve İlerlemeler
      20: { name: "Tahta Çubuk", type: "material" },
      21: { name: "Bakır Çubuk", type: "material" },
      22: { name: "Demir Çubuk", type: "material" },
      23: { name: "Altın Çubuk", type: "material" },
      24: { name: "Elmas", type: "material" },
      // Aletler
      30: { name: "Tahta Kazma", type: "tool", power: 1, speed: 1.2 },
      31: { name: "Demir Kazma", type: "tool", power: 2, speed: 2.0 },
      32: { name: "Elmas Kazma", type: "tool", power: 3, speed: 3.5 },
      // Zırhlar
      40: { name: "Bakır Kask", type: "armor", slot: "helmet", defense: 2 },
      41: { name: "Bakır Göğüslük", type: "armor", slot: "chest", defense: 3 },
      42: { name: "Bakır Pantolon", type: "armor", slot: "legs", defense: 2 },
      43: { name: "Demir Kask", type: "armor", slot: "helmet", defense: 4 },
      44: { name: "Demir Göğüslük", type: "armor", slot: "chest", defense: 6 },
      45: { name: "Demir Pantolon", type: "armor", slot: "legs", defense: 5 },
    };

    // Crafting Tarifler
    const recipes = [
      { result: { id: 20, count: 4 }, ingredients: [{ id: 4, count: 1 }], station: "none" }, // Odun -> 4 Tahta Çubuk
      { result: { id: 30, count: 1 }, ingredients: [{ id: 20, count: 3 }, { id: 4, count: 2 }], station: "none" }, // Tahta Kazma
      { result: { id: 9, count: 1 }, ingredients: [{ id: 4, count: 10 }], station: "none" }, // Çalışma Masası
      { result: { id: 10, count: 1 }, ingredients: [{ id: 3, count: 8 }], station: "workbench" }, // Fırın
      { result: { id: 21, count: 1 }, ingredients: [{ id: 12, count: 1 }], station: "furnace" }, // Bakır eritme
      { result: { id: 22, count: 1 }, ingredients: [{ id: 6, count: 1 }], station: "furnace" }, // Demir eritme
      { result: { id: 23, count: 1 }, ingredients: [{ id: 7, count: 1 }], station: "furnace" }, // Altın eritme
      { result: { id: 31, count: 1 }, ingredients: [{ id: 22, count: 5 }], station: "workbench" }, // Demir Kazma
      { result: { id: 32, count: 1 }, ingredients: [{ id: 24, count: 5 }, { id: 22, count: 3 }], station: "workbench" }, // Elmas Kazma
      { result: { id: 40, count: 1 }, ingredients: [{ id: 21, count: 5 }], station: "workbench" }, // Bakır Kask
      { result: { id: 41, count: 1 }, ingredients: [{ id: 21, count: 8 }], station: "workbench" }, // Bakır Göğüslük
      { result: { id: 42, count: 1 }, ingredients: [{ id: 21, count: 6 }], station: "workbench" }, // Bakır Pantolon
      { result: { id: 43, count: 1 }, ingredients: [{ id: 22, count: 5 }], station: "workbench" }, // Demir Kask
      { result: { id: 44, count: 1 }, ingredients: [{ id: 22, count: 8 }], station: "workbench" }, // Demir Göğüslük
      { result: { id: 45, count: 1 }, ingredients: [{ id: 22, count: 6 }], station: "workbench" }, // Demir Pantolon
    ];

    // Oyuncu Verileri
    let player = {
      x: 125 * TILE_SIZE,
      y: 40 * TILE_SIZE,
      w: 12,
      h: 26,
      vx: 0,
      vy: 0,
      speed: 2.2,
      jumpForce: -8.5,
      grounded: false,
      maxHealth: 100,
      health: 100,
      inventory: Array(20).fill(null),
      hotbar: Array(5).fill(null),
      armor: { helmet: null, chest: null, legs: null, acc: null },
      selectedHotbar: 0
    };

    // Başlangıç Eşyaları
    player.hotbar[0] = { id: 30, count: 1 }; // Tahta Kazma
    player.hotbar[1] = { id: 4, count: 20 }; // Odun

    let camera = { x: 0, y: 0 };
    let gameTime = 0; // 0 - 24000
    let isInventoryOpen = false;
    let touchModePlace = false;

    // Otomatik Kayıt (Tarayıcı/Google Profil Hafızası - localStorage)
    function saveGame() {
      const saveData = {
        player: {
          x: player.x,
          y: player.y,
          health: player.health,
          inventory: player.inventory,
          hotbar: player.hotbar,
          armor: player.armor
        },
        blocks: blocks,
        gameTime: gameTime
      };
      localStorage.setItem('terraria_save_v3', JSON.stringify(saveData));
    }

    function loadGame() {
      const saved = localStorage.getItem('terraria_save_v3');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          player.x = data.player.x;
          player.y = data.player.y;
          player.health = data.player.health;
          player.inventory = data.player.inventory;
          player.hotbar = data.player.hotbar;
          player.armor = data.player.armor;
          blocks = data.blocks;
          gameTime = data.gameTime || 0;
          return true;
        } catch(e) {
          console.error("Kayıt yükleme hatası", e);
        }
      }
      return false;
    }

    function resetGameData() {
      localStorage.removeItem('terraria_save_v3');
      location.reload();
    }

    // Dünya Oluşturma
    function generateWorld() {
      if (loadGame()) return;

      blocks = [];
      for (let x = 0; x < WORLD_WIDTH; x++) {
        blocks[x] = [];
        let surfaceY = 45 + Math.floor(Math.sin(x * 0.05) * 4 + Math.cos(x * 0.02) * 6);
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          if (y < surfaceY) {
            blocks[x][y] = BLOCK_AIR;
          } else if (y === surfaceY) {
            blocks[x][y] = BLOCK_GRASS;
          } else if (y < surfaceY + 5) {
            blocks[x][y] = BLOCK_DIRT;
          } else {
            let r = Math.random();
            let bType = BLOCK_STONE;
            if (y > surfaceY + 20 && r < 0.04) bType = BLOCK_COPPER_ORE;
            if (y > surfaceY + 35 && r < 0.03) bType = BLOCK_IRON_ORE;
            if (y > surfaceY + 55 && r < 0.02) bType = BLOCK_GOLD_ORE;
            if (y > surfaceY + 75 && r < 0.01) bType = BLOCK_DIAMOND_ORE;
            blocks[x][y] = bType;
          }
        }
        // Basit Ağaç Üretimi
        if (x % 12 === 3 && surfaceY > 5) {
          let tY = surfaceY - 1;
          for (let ty = tY; ty > tY - 4; ty--) blocks[x][ty] = BLOCK_WOOD;
          for (let wx = x - 2; wx <= x + 2; wx++) {
            for (let wy = tY - 6; wy <= tY - 4; wy++) {
              if (wx >= 0 && wx < WORLD_WIDTH && blocks[wx][wy] === BLOCK_AIR) {
                blocks[wx][wy] = BLOCK_LEAVES;
              }
            }
          }
        }
      }
      player.x = 125 * TILE_SIZE;
      player.y = 35 * TILE_SIZE;
    }

    // Canlılar (Zombi, İnek vb.)
    function spawnEntities() {
      entities.push({ type: 'zombie', x: 140 * TILE_SIZE, y: 35 * TILE_SIZE, w: 14, h: 26, vx: 0, vy: 0, health: 50, maxHealth: 50 });
      entities.push({ type: 'cow', x: 110 * TILE_SIZE, y: 40 * TILE_SIZE, w: 20, h: 16, vx: 0, vy: 0, health: 30, maxHealth: 30 });
    }

    // Çizim Fonksiyonları & Karakter Görünümü (İstediğin Kırmızı-Siyah Örüntülü Gömlek Tasarımı)
    function renderPlayer(ctx, x, y, dir) {
      ctx.save();
      ctx.translate(x, y);
      if (dir === -1) {
        ctx.scale(-1, 1);
        ctx.translate(-player.w, 0);
      }

      // Zırh giyilmemişse özel tasarım gömlek ve pantolon çizilir (Hiçbir zaman renk değiştirmez/parlamaz)
      // Ayaklar / Siyah Ayakkabılar
      ctx.fillStyle = "#111827";
      ctx.fillRect(2, 22, 3, 4);
      ctx.fillRect(7, 22, 3, 4);

      // Lacivert Pantolon
      ctx.fillStyle = "#1e3a8a";
      ctx.fillRect(2, 14, 3, 8);
      ctx.fillRect(7, 14, 3, 8);

      // Gövde: Kırmızı-Siyah Örüntülü (Tek tek piksel satranç deseni), önü biraz açık, alttan beyaz tişört görünen gömlek
      // Alttan görünen beyaz tişört alt kısım
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(2, 12, 8, 2);

      // Kırmızı-Siyah Örüntülü Gömlek Üst Kısım ve Ön Açıklık Efekti
      for (let px = 1; px < 11; px++) {
        for (let py = 4; py < 12; py++) {
          // Önü biraz açık orta bölge (ortada dikey boşluk)
          if (px === 5 && py >= 8) {
            ctx.fillStyle = "#ffffff"; // Açıklıktan görünen iç tişört
          } else {
            // Tek tek piksel kırmızı ve siyah örüntü
            ctx.fillStyle = ((px + py) % 2 === 0) ? "#dc2626" : "#0f172a";
          }
          ctx.fillRect(px, py, 1, 1);
        }
      }

      // Kollar
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(-1, 5, 2, 7);
      ctx.fillRect(11, 5, 2, 7);

      // Baş / Ten
      ctx.fillStyle = "#fbcfe8";
      ctx.fillRect(2, -4, 8, 8);
      // Saç
      ctx.fillStyle = "#78350f";
      ctx.fillRect(2, -5, 8, 3);

      ctx.restore();
    }

    // Oyun Döngüsü ve Fizik
    let lastSaveTimer = 0;
    function update(dt) {
      gameTime = (gameTime + 1) % 24000;

      // Yerçekimi ve Fizik
      player.vy += 0.4;
      player.x += player.vx;
      resolveCollisionsX(player);
      player.y += player.vy;
      resolveCollisionsY(player);

      // Canlılar Güncelleme
      entities.forEach(en => {
        en.vy += 0.4;
        en.x += en.vx;
        resolveCollisionsX(en);
        en.y += en.vy;
        resolveCollisionsY(en);

        if (en.type === 'zombie') {
          if (en.x < player.x) en.vx = 0.8;
          else en.vx = -0.8;
        } else if (en.type === 'cow') {
          if (Math.random() < 0.02) en.vx = (Math.random() - 0.5) * 1.2;
        }
      });

      // Kamera Takibi
      camera.x = player.x - (canvas.width / ZOOM) / 2;
      camera.y = player.y - (canvas.height / ZOOM) / 2;

      // Otomatik Kayıt (Her 10 saniyede bir)
      lastSaveTimer += dt;
      if (lastSaveTimer > 10000) {
        saveGame();
        lastSaveTimer = 0;
      }
    }

    function resolveCollisionsX(ent) {
      let leftTile = Math.floor(ent.x / TILE_SIZE);
      let rightTile = Math.floor((ent.x + ent.w) / TILE_SIZE);
      let topTile = Math.floor(ent.y / TILE_SIZE);
      let bottomTile = Math.floor((ent.y + ent.h - 1) / TILE_SIZE);

      for (let tx = leftTile; tx <= rightTile; tx++) {
        for (let ty = topTile; ty <= bottomTile; ty++) {
          if (isSolid(tx, ty)) {
            if (ent.vx > 0) ent.x = tx * TILE_SIZE - ent.w;
            else if (ent.vx < 0) ent.x = (tx + 1) * TILE_SIZE;
            ent.vx = 0;
          }
        }
      }
    }

    function resolveCollisionsY(ent) {
      let leftTile = Math.floor(ent.x / TILE_SIZE);
      let rightTile = Math.floor((ent.x + ent.w - 1) / TILE_SIZE);
      let topTile = Math.floor(ent.y / TILE_SIZE);
      let bottomTile = Math.floor((ent.y + ent.h) / TILE_SIZE);

      ent.grounded = false;
      for (let tx = leftTile; tx <= rightTile; tx++) {
        for (let ty = topTile; ty <= bottomTile; ty++) {
          if (isSolid(tx, ty)) {
            if (ent.vy > 0) {
              ent.y = ty * TILE_SIZE - ent.h;
              ent.grounded = true;
            } else if (ent.vy < 0) {
              ent.y = (ty + 1) * TILE_SIZE;
            }
            ent.vy = 0;
          }
        }
      }
    }

    function isSolid(tx, ty) {
      if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) return true;
      let b = blocks[tx][ty];
      return b !== BLOCK_AIR && b !== BLOCK_LEAVES && b !== BLOCK_TORCH;
    }

    // Render (Çizim)
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(ZOOM, ZOOM);
      ctx.translate(-camera.x, -camera.y);

      // Gökyüzü Rengi (Zamana Göre)
      let skyColor = "#38bdf8";
      if (gameTime > 13000 && gameTime < 22000) skyColor = "#020617";
      else if (gameTime >= 12000 && gameTime <= 13000 || gameTime >= 22000) skyColor = "#f97316";
      
      ctx.fillStyle = skyColor;
      ctx.fillRect(camera.x, camera.y, canvas.width / ZOOM, canvas.height / ZOOM);

      // Bloklar Çizimi
      let startX = Math.max(0, Math.floor(camera.x / TILE_SIZE));
      let endX = Math.min(WORLD_WIDTH, Math.floor((camera.x + canvas.width / ZOOM) / TILE_SIZE) + 1);
      let startY = Math.max(0, Math.floor(camera.y / TILE_SIZE));
      let endY = Math.min(WORLD_HEIGHT, Math.floor((camera.y + canvas.height / ZOOM) / TILE_SIZE) + 1);

      for (let x = startX; x < endX; x++) {
        for (let y = startY; y < endY; y++) {
          let b = blocks[x][y];
          if (b === BLOCK_AIR) continue;

          if (b === BLOCK_GRASS) ctx.fillStyle = "#22c55e";
          else if (b === BLOCK_DIRT) ctx.fillStyle = "#b45309";
          else if (b === BLOCK_STONE) ctx.fillStyle = "#64748b";
          else if (b === BLOCK_WOOD) ctx.fillStyle = "#78350f";
          else if (b === BLOCK_LEAVES) ctx.fillStyle = "#15803d";
          else if (b === BLOCK_IRON_ORE) ctx.fillStyle = "#d97706";
          else if (b === BLOCK_GOLD_ORE) ctx.fillStyle = "#eab308";
          else if (b === BLOCK_DIAMOND_ORE) ctx.fillStyle = "#06b6d4";
          else if (b === BLOCK_WORKBENCH) ctx.fillStyle = "#9a3412";
          else if (b === BLOCK_FURNACE) ctx.fillStyle = "#475569";
          else if (b === BLOCK_COPPER_ORE) ctx.fillStyle = "#b45309";
          else ctx.fillStyle = "#fff";

          ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }

      // Canlılar Çizimi
      entities.forEach(en => {
        if (en.type === 'zombie') {
          ctx.fillStyle = "#15803d";
          ctx.fillRect(en.x, en.y, en.w, en.h);
        } else if (en.type === 'cow') {
          ctx.fillStyle = "#f8fafc";
          ctx.fillRect(en.x, en.y, en.w, en.h);
        }
      });

      // Oyuncu Çizimi
      renderPlayer(ctx, player.x, player.y, player.vx < 0 ? -1 : 1);

      ctx.restore();

      // UI Güncelleme
      document.getElementById('health-val').innerText = player.health;
      document.getElementById('time-val').innerText = (gameTime > 13000 && gameTime < 22000) ? "Gece" : "Gündüz";
    }

    // UI ve Envanter Yönetimi
    function updateHotbarUI() {
      const hbEl = document.getElementById('hotbar');
      hbEl.innerHTML = '';
      player.hotbar.forEach((item, idx) => {
        const slot = document.createElement('div');
        slot.className = `hotbar-slot ${player.selectedHotbar === idx ? 'selected' : ''}`;
        slot.onclick = () => { player.selectedHotbar = idx; updateHotbarUI(); };
        
        if (item) {
          const countB = document.createElement('b');
          countB.innerText = item.count > 1 ? item.count : '';
          slot.appendChild(countB);
        }
        hbEl.appendChild(slot);
      });
    }

    function openInventoryModal() {
      isInventoryOpen = true;
      document.getElementById('inventory-modal').style.display = 'block';
      renderInventoryGrid();
    }

    function closeInventoryModal() {
      isInventoryOpen = false;
      document.getElementById('inventory-modal').style.display = 'none';
    }

    function renderInventoryGrid() {
      const grid = document.getElementById('main-inventory-grid');
      grid.innerHTML = '';
      player.inventory.forEach((item, idx) => {
        const slot = document.createElement('div');
        slot.className = 'inv-slot';
        if (item) {
          const countB = document.createElement('b');
          countB.innerText = item.count > 1 ? item.count : '';
          slot.appendChild(countB);
        }
        grid.appendChild(slot);
      });
      renderRecipes();
    }

    function renderRecipes() {
      const list = document.getElementById('recipe-list');
      list.innerHTML = '';
      recipes.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `<span>${itemsData[r.result.id].name} (x${r.result.count})</span>`;
        const btn = document.createElement('button');
        btn.innerText = "Üret";
        btn.onclick = () => {
          player.inventory.push({ id: r.result.id, count: r.result.count });
          renderInventoryGrid();
          updateHotbarUI();
        };
        card.appendChild(btn);
        list.appendChild(card);
      });
    }

    // Kontroller & Olaylar
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (isMobile) {
      document.getElementById('mobile-controls').style.display = 'flex';
      document.getElementById('mobile-hotbar-container').style.display = 'block';
      document.getElementById('desktop-hints').style.display = 'none';
    }

    let keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') {
        if (isInventoryOpen) closeInventoryModal();
        else openInventoryModal();
      }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Mobil Buton Bağlantıları
    function setupTouchBtn(id, actionDown, actionUp) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', e => { e.preventDefault(); actionDown(); });
      btn.addEventListener('touchend', e => { e.preventDefault(); if(actionUp) actionUp(); });
    }

    setupTouchBtn('btn-left', () => { player.vx = -player.speed; }, () => { player.vx = 0; });
    setupTouchBtn('btn-right', () => { player.vx = player.speed; }, () => { player.vx = 0; });
    setupTouchBtn('btn-jump', () => { if (player.grounded) { player.vy = player.jumpForce; player.grounded = false; } });
    setupTouchBtn('btn-inv', () => { if (isInventoryOpen) closeInventoryModal(); else openInventoryModal(); });
    
    document.getElementById('close-inv-btn').onclick = closeInventoryModal;
    document.getElementById('reset-btn').onclick = resetGameData;
    document.getElementById('fullscreen-btn').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    };

    // Başlat
    generateWorld();
    spawnEntities();
    updateHotbarUI();

    let lastTime = 0;
    function gameLoop(timestamp) {
      let dt = timestamp - lastTime;
      lastTime = timestamp;

      // Klavye Hareketleri
      if (!isMobile) {
        player.vx = 0;
        if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
        if (keys['d'] || keys['arrowright']) player.vx = player.speed;
        if ((keys['w'] || keys[' '] || keys['arrowup']) && player.grounded) {
          player.vy = player.jumpForce;
          player.grounded = false;
        }
      }

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
