<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria 2D Survival Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    /* HUD Arayüzü */
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 13px;
    }
    .controls-hint {
      font-size: 11px;
      color: #cbd5e1;
      text-shadow: 1px 1px 2px #000;
    }

    /* Envanter Modal (E Tuşu) */
    #inventory-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      width: 380px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      z-index: 20;
      color: #fff;
    }
    #inventory-modal h2 {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .recipe-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.8);
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .recipe-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .craft-btn { background: #0284c7; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="ui">
    <div class="hud-card">
      <span id="health-display">❤️ 100 / 100</span>
      <span style="opacity: 0.3;">|</span>
      <span id="time-display">☀️ Gündüz</span>
    </div>
    <div class="controls-hint">
      [A/D] Yürü | [W/Space] Zıpla | [E] Envanter | [1-5] Slot Seç | [Sol Tık] Kır | [Sağ Tık] Koy
    </div>
  </div>

  <div id="inventory-modal">
    <h2>CRAFTING & ENVANTER</h2>
    <div class="inv-grid" id="inv-grid"></div>
    <div class="recipe-list" id="recipe-list"></div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const TILE_SIZE = 32;
const ZOOM = 1.85; 
const MAP_W = 200;
const MAP_H = 120;

const ITEM_TYPES = {
  0: { name: "Hava", solid: false },
  1: { name: "Çimen", solid: true, time: 30, color: "#5bb32a", darkColor: "#3e801b", borderHighlight: "#8ee356" },
  2: { name: "Toprak", solid: true, time: 40, color: "#866043", darkColor: "#573d2a", borderHighlight: "#a37857" },
  3: { name: "Taş", solid: true, time: 140, needTool: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3" },
  4: { name: "Ağaç Gövdesi", solid: true, time: 80, color: "#674627", darkColor: "#3d2815", borderHighlight: "#8a5e36" },
  5: { name: "Yaprak", solid: false, time: 15, color: "#2d8a1e", darkColor: "#1a5710", borderHighlight: "#45b033" },
  6: { name: "Kömür", solid: true, time: 180, needTool: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#171717" },
  7: { name: "Bakır", solid: true, time: 220, needTool: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#d97706" },
  8: { name: "Ahşap Blok", solid: true, time: 60, color: "#a16207", darkColor: "#713f12", borderHighlight: "#ca8a04" },
  9: { name: "Çubuk", solid: false, isItem: true, color: "#78350f" },
  10: { name: "Tahta Kazma", solid: false, isTool: true, speed: 4.0, color: "#d97706" },
  11: { name: "Taş Kazma", solid: false, isTool: true, speed: 8.0, color: "#94a3b8" }
};

let world = [];
let surfaceY = 40;

function initWorld() {
  world = [];
  for (let y = 0; y < MAP_H; y++) {
    world[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      if (y < curSurface) {
        world[y][x] = 0;
      } else if (y === curSurface) {
        world[y][x] = 1;
      } else if (y < curSurface + 10) {
        world[y][x] = 2;
      } else {
        let r = Math.random();
        if (r < 0.05) world[y][x] = 6;
        else if (r < 0.08) world[y][x] = 7;
        else world[y][x] = 3;
      }
    }
  }

  for (let x = 8; x < MAP_W - 8; x += Math.floor(Math.random() * 5) + 5) {
    if (Math.random() > 0.3) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      let treeH = Math.floor(Math.random() * 3) + 4;
      for (let h = 1; h <= treeH; h++) {
        if (curSurface - h >= 0) world[curSurface - h][x] = 4;
      }
      let top = curSurface - treeH;
      for (let lx = -2; lx <= 2; lx++) {
        for (let ly = -3; ly <= -1; ly++) {
          if (world[top + ly] && world[top + ly][x + lx] === 0) {
            world[top + ly][x + lx] = 5;
          }
        }
      }
    }
  }
}
initWorld();

let timeOfDay = 0;
function updateTime(amount) {
  timeOfDay = (timeOfDay + amount) % 1.0;
  document.getElementById("time-display").innerText = timeOfDay < 0.5 ? "☀️ Gündüz" : "🌙 Gece";
}

let player = {
  x: 20 * TILE_SIZE,
  y: (surfaceY - 4) * TILE_SIZE,
  w: 18,
  h: 42,
  vx: 0,
  vy: 0,
  accX: 0.6,
  maxSpeed: 2.8,
  friction: 0.8,
  grounded: false,
  facing: 1,
  selectedSlot: 0,
  animFrame: 0
};

let camX = player.x;
let camY = player.y;

const hotbar = [0, 0, 0, 0, 0];
const inventoryStorage = { 1: 0, 2: 0, 3: 0, 4: 0, 8: 0, 9: 0, 10: 0, 11: 0 };
const keys = {};

let mining = { active: false, x: -1, y: -1, progress: 0 };

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;

  if ("12345".includes(e.key)) {
    player.selectedSlot = parseInt(e.key) - 1;
  }

  if ((k === "w" || k === " ") && player.grounded) {
    player.vy = -8.2;
    player.grounded = false;
    timeOfDay = 0.0;
    updateTime(0);
  }

  if (k === "e") toggleInventoryModal();
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function isSolidBlock(px, py) {
  let tx = Math.floor(px / TILE_SIZE);
  let ty = Math.floor(py / TILE_SIZE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return ITEM_TYPES[world[ty][tx]].solid;
}

function updatePhysics() {
  if (keys["a"] || keys["arrowleft"]) {
    player.vx -= player.accX;
    player.facing = -1;
    updateTime(0.0005);
  } else if (keys["d"] || keys["arrowright"]) {
    player.vx += player.accX;
    player.facing = 1;
    updateTime(0.0005);
  } else {
    player.vx *= player.friction;
  }

  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.vy += 0.42;

  if (Math.abs(player.vx) > 0.2 && player.grounded) player.animFrame += 0.2;
  else player.animFrame = 0;

  player.x += player.vx;
  if (player.vx > 0 && (isSolidBlock(player.x + player.w, player.y) || isSolidBlock(player.x + player.w, player.y + player.h - 2))) {
    player.x = Math.floor((player.x + player.w) / TILE_SIZE) * TILE_SIZE - player.w - 0.1;
    player.vx = 0;
  }
  if (player.vx < 0 && (isSolidBlock(player.x, player.y) || isSolidBlock(player.x, player.y + player.h - 2))) {
    player.x = Math.floor(player.x / TILE_SIZE + 1) * TILE_SIZE + 0.1;
    player.vx = 0;
  }

  player.y += player.vy;
  player.grounded = false;
  if (player.vy > 0 && (isSolidBlock(player.x + 2, player.y + player.h) || isSolidBlock(player.x + player.w - 2, player.y + player.h))) {
    player.y = Math.floor((player.y + player.h) / TILE_SIZE) * TILE_SIZE - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  if (mining.active) {
    let activeItem = hotbar[player.selectedSlot];
    let speed = ITEM_TYPES[activeItem]?.speed || 1.0;
    let target = world[mining.y]?.[mining.x];

    if (target && target !== 0) {
      if (ITEM_TYPES[target].needTool && !ITEM_TYPES[activeItem]?.isTool) {
        mining.progress = 0;
      } else {
        mining.progress += speed;
        if (mining.progress >= ITEM_TYPES[target].time) {
          inventoryStorage[target] = (inventoryStorage[target] || 0) + 1;
          autoAssignToHotbar(target);
          world[mining.y][mining.x] = 0;
          mining.active = false;
        }
      }
    } else {
      mining.active = false;
    }
  }
}

function autoAssignToHotbar(itemId) {
  if (hotbar.includes(itemId)) return;
  for (let i = 0; i < 5; i++) {
    if (hotbar[i] === 0) {
      hotbar[i] = itemId;
      break;
    }
  }
}

// MINECRAFT TARZI GELİŞMİŞ BLOK ÇİZİMİ
function renderTile(id, x, y, size, targetCtx = ctx) {
  if (!id || id === 0) return;

  const info = ITEM_TYPES[id];
  
  if (info.isTool) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + 4, y + 6, size - 8, 5);
    targetCtx.fillStyle = "#78350f";
    targetCtx.fillRect(x + size / 2 - 2, y + 10, 4, size - 14);
    return;
  }

  if (info.isItem) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + size / 2 - 2, y + 4, 4, size - 8);
    return;
  }

  // 1. Ana Gövde Renk Dolgusu
  targetCtx.fillStyle = info.color;
  targetCtx.fillRect(x, y, size, size);

  // 2. Minecraft Usulü 3D Kenar Işıkları ve Gölgeleri
  targetCtx.fillStyle = info.borderHighlight;
  targetCtx.fillRect(x, y, size, 3); // Üst parlaklık
  targetCtx.fillRect(x, y, 3, size); // Sol parlaklık

  targetCtx.fillStyle = info.darkColor;
  targetCtx.fillRect(x, y + size - 3, size, 3); // Alt gölge
  targetCtx.fillRect(x + size - 3, y, 3, size); // Sağ gölge

  // 3. Bloğa Özel Doku ve Piksel Detayları
  if (id === 1) { // Çimen Bloğu
    targetCtx.fillStyle = "#866043"; // Altı toprak
    targetCtx.fillRect(x + 3, y + 10, size - 6, size - 13);
    targetCtx.fillStyle = info.color;
    // Çimen Püskülleri
    targetCtx.fillRect(x, y, size, 8);
    targetCtx.fillRect(x + 3, y + 8, 4, 4);
    targetCtx.fillRect(x + 11, y + 8, 5, 5);
    targetCtx.fillRect(x + 20, y + 8, 4, 3);
    targetCtx.fillRect(x + 26, y + 8, 4, 6);
  } else if (id === 2 || id === 3) { // Toprak ve Taş Parçacıkları
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 5, y + 6, 6, 5);
    targetCtx.fillRect(x + 18, y + 14, 7, 6);
    targetCtx.fillRect(x + 8, y + 22, 5, 4);
  } else if (id === 6 || id === 7) { // Kömür & Bakır Maden Damarları
    targetCtx.fillStyle = info.darkColor; // Önce taş dokusu
    targetCtx.fillRect(x + 5, y + 6, 6, 5);
    targetCtx.fillRect(x + 18, y + 14, 7, 6);
    // Parlak Cevher Parçaları
    targetCtx.fillStyle = info.oreColor;
    targetCtx.fillRect(x + 7, y + 8, 7, 7);
    targetCtx.fillRect(x + 17, y + 6, 6, 6);
    targetCtx.fillRect(x + 12, y + 19, 8, 6);
  } else if (id === 4) { // Ağaç Lifleri
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 6, y + 3, 4, size - 6);
    targetCtx.fillRect(x + 18, y + 3, 5, size - 6);
  } else if (id === 5) { // Yaprak Bloğu Desenleri
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 4, y + 4, 8, 8);
    targetCtx.fillRect(x + 16, y + 16, 10, 10);
  }
}

function renderPlayerTerraria(screenX, screenY) {
  let anim = Math.sin(player.animFrame) * 4;

  ctx.save();
  ctx.translate(screenX + player.w / 2, screenY + player.h / 2);
  if (player.facing === -1) ctx.scale(-1, 1);

  ctx.fillStyle = "#451a03";
  ctx.fillRect(-6, 12 + anim, 5, 8);
  ctx.fillRect(2, 12 - anim, 5, 8);

  ctx.fillStyle = "#1e3a8a";
  ctx.fillRect(-6, 4, 5, 9);
  ctx.fillRect(2, 4, 5, 9);

  ctx.fillStyle = "#dc2626";
  ctx.fillRect(-7, -8, 14, 13);

  ctx.fillStyle = "#fca5a5";
  ctx.fillRect(-10, -6 - anim * 0.5, 4, 10);
  ctx.fillRect(6, -6 + anim * 0.5, 4, 10);

  ctx.fillStyle = "#fca5a5";
  ctx.fillRect(-6, -21, 13, 13);

  ctx.fillStyle = "#0f172a";
  ctx.fillRect(-2, -16, 2, 4);
  ctx.fillRect(3, -16, 2, 4);

  ctx.fillStyle = "#78350f";
  ctx.fillRect(-7, -23, 15, 4);
  ctx.fillRect(-7, -20, 3, 5);

  ctx.restore();
}

function render() {
  camX += (player.x - camX) * 0.1;
  camY += (player.y - camY) * 0.1;

  ctx.save();
  ctx.scale(ZOOM, ZOOM);

  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;

  let drawCamX = camX - viewW / 2;
  let drawCamY = camY - viewH / 2;

  drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, drawCamX));
  drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, drawCamY));

  let skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
  if (timeOfDay < 0.5) {
    skyGrad.addColorStop(0, "#0284c7");
    skyGrad.addColorStop(1, "#7dd3fc");
  } else {
    skyGrad.addColorStop(0, "#020617");
    skyGrad.addColorStop(1, "#0f172a");
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, viewW, viewH);

  let startX = Math.max(0, Math.floor(drawCamX / TILE_SIZE));
  let endX = Math.min(MAP_W, Math.ceil((drawCamX + viewW) / TILE_SIZE));
  let startY = Math.max(0, Math.floor(drawCamY / TILE_SIZE));
  let endY = Math.min(MAP_H, Math.ceil((drawCamY + viewH) / TILE_SIZE));

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      let tile = world[y][x];
      if (tile !== 0) {
        renderTile(tile, x * TILE_SIZE - drawCamX, y * TILE_SIZE - drawCamY, TILE_SIZE);
      }
    }
  }

  if (mining.active) {
    let bx = mining.x * TILE_SIZE - drawCamX;
    let by = mining.y * TILE_SIZE - drawCamY;
    let target = world[mining.y][mining.x];
    let ratio = mining.progress / ITEM_TYPES[target].time;

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, TILE_SIZE, TILE_SIZE);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(bx, by, TILE_SIZE * ratio, TILE_SIZE);
  }

  renderPlayerTerraria(player.x - drawCamX, player.y - drawCamY);

  let lightGrad = ctx.createRadialGradient(
    player.x - drawCamX + player.w / 2, player.y - drawCamY + player.h / 2, 15,
    player.x - drawCamX + player.w / 2, player.y - drawCamY + player.h / 2, 160
  );
  lightGrad.addColorStop(0, "rgba(255,255,255,0)");
  lightGrad.addColorStop(1, timeOfDay >= 0.5 ? "rgba(2, 6, 23, 0.85)" : "rgba(0,0,0,0)");
  ctx.fillStyle = lightGrad;
  ctx.fillRect(0, 0, viewW, viewH);

  ctx.restore();

  renderCanvasHotbarUI();
}

function renderCanvasHotbarUI() {
  const slotSize = 48;
  const gap = 8;
  const startX = (canvas.width - (5 * slotSize + 4 * gap)) / 2;
  const startY = canvas.height - slotSize - 16;

  for (let i = 0; i < 5; i++) {
    let sx = startX + i * (slotSize + gap);
    let sy = startY;

    ctx.fillStyle = i === player.selectedSlot ? "rgba(56, 189, 248, 0.3)" : "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(sx, sy, slotSize, slotSize);

    ctx.strokeStyle = i === player.selectedSlot ? "#38bdf8" : "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = i === player.selectedSlot ? 3 : 1.5;
    ctx.strokeRect(sx, sy, slotSize, slotSize);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText(i + 1, sx + 4, sy + 12);

    let itemKey = hotbar[i];
    if (itemKey && itemKey !== 0) {
      renderTile(itemKey, sx + 8, sy + 8, 32, ctx);

      if (!ITEM_TYPES[itemKey].isTool) {
        let count = inventoryStorage[itemKey] || 0;
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(count, sx + slotSize - 4, sy + slotSize - 4);
        ctx.textAlign = "left";
      }
    }
  }
}

const craftingRecipes = [
  { item: 8, count: 4, cost: { 4: 1 }, name: "Ahşap Blok (4x)" },
  { item: 9, count: 4, cost: { 8: 2 }, name: "Ahşap Çubuk (4x)" },
  { item: 10, count: 1, cost: { 8: 3, 9: 2 }, name: "Tahta Kazma" },
  { item: 11, count: 1, cost: { 3: 3, 9: 2 }, name: "Taş Kazma" }
];

function toggleInventoryModal() {
  const modal = document.getElementById("inventory-modal");
  const isVisible = modal.style.display === "block";
  modal.style.display = isVisible ? "none" : "block";

  if (!isVisible) {
    const invGrid = document.getElementById("inv-grid");
    invGrid.innerHTML = "";
    Object.keys(inventoryStorage).forEach(k => {
      let count = inventoryStorage[k];
      if (count > 0 || ITEM_TYPES[k].isTool) {
        let div = document.createElement("div");
        div.style.cssText = "background:rgba(30,41,59,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:6px; text-align:center; font-size:11px;";
        div.innerHTML = `<div>${ITEM_TYPES[k].name}</div><b>${count} Adet</b>`;
        invGrid.appendChild(div);
      }
    });

    const list = document.getElementById("recipe-list");
    list.innerHTML = "";
    craftingRecipes.forEach(r => {
      let canCraft = Object.keys(r.cost).every(k => (inventoryStorage[k] || 0) >= r.cost[k]);
      let card = document.createElement("div");
      card.className = "recipe-card" + (canCraft ? "" : " disabled");
      card.innerHTML = `<span>${r.name}</span><span class="craft-btn">${canCraft ? "ÜRET" : "Eksik"}</span>`;
      card.onclick = () => {
        if (canCraft) {
          Object.keys(r.cost).forEach(k => inventoryStorage[k] -= r.cost[k]);
          inventoryStorage[r.item] = (inventoryStorage[r.item] || 0) + r.count;
          autoAssignToHotbar(r.item);
          toggleInventoryModal();
        }
      };
      list.appendChild(card);
    });
  }
}

canvas.onmousedown = e => {
  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;
  let drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, camX - viewW / 2));
  let drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, camY - viewH / 2));

  let clickX = (e.clientX / ZOOM) + drawCamX;
  let clickY = (e.clientY / ZOOM) + drawCamY;

  let tx = Math.floor(clickX / TILE_SIZE);
  let ty = Math.floor(clickY / TILE_SIZE);

  let dist = Math.hypot(tx * TILE_SIZE - player.x, ty * TILE_SIZE - player.y);
  if (dist > TILE_SIZE * 8) return;

  if (e.button === 0 && world[ty]?.[tx] !== 0) {
    mining.active = true;
    mining.x = tx;
    mining.y = ty;
    mining.progress = 0;
  } else if (e.button === 2) {
    let activeItem = hotbar[player.selectedSlot];
    if (activeItem && !ITEM_TYPES[activeItem].isTool && !ITEM_TYPES[activeItem].isItem && (inventoryStorage[activeItem] || 0) > 0 && world[ty]?.[tx] === 0) {
      world[ty][tx] = activeItem;
      inventoryStorage[activeItem]--;
    }
  }
};

canvas.onmouseup = () => mining.active = false;
canvas.oncontextmenu = e => e.preventDefault();

function loop() {
  updatePhysics();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
