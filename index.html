<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terraria 2D Survival Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-card {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 13px;
    }
    .controls-hint {
      font-size: 11px;
      color: #cbd5e1;
      text-shadow: 1px 1px 2px #000;
    }

    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      justify-content: space-between;
      z-index: 15;
      pointer-events: none;
    }
    .touch-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      outline: none;
    }
    .touch-btn:active {
      background: rgba(56, 189, 248, 0.4);
      transform: scale(0.95);
    }

    #inventory-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 520px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      z-index: 20;
      color: #fff;
    }
    #inventory-modal h2 {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }
    .section-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .inventory-container {
      display: flex;
      gap: 15px;
    }
    .main-inv-area {
      flex: 1;
    }
    .armor-equip-area {
      width: 65px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 12px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .inv-slot {
      width: 50px;
      height: 50px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
    }
    .inv-slot:active { cursor: grabbing; }
    .inv-slot canvas { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; }
    .inv-slot b {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      color: #fff;
      text-shadow: 1px 1px #000;
      pointer-events: none;
    }

    #tooltip {
      display: none;
      position: fixed;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      pointer-events: none;
      z-index: 30;
      white-space: nowrap;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }
    .recipe-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .recipe-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .craft-btn { background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="game"></canvas>
  <div id="tooltip"></div>

  <div id="ui">
    <div class="hud-card">
      <span id="health-display">❤️ 100 / 100</span>
      <span style="opacity: 0.3;">|</span>
      <span id="time-display">☀️ Gündüz</span>
    </div>
    <div class="controls-hint" id="desktop-hint">
      [A/D] Yürü | [W/Space] Zıpla | [E] Envanter | [1-5] Slot | [Sol Tık] Kır/Salla | [Sağ Tık] Koy
    </div>
  </div>

  <div id="mobile-controls">
    <div class="touch-group">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn" id="btn-jump">⬆</button>
      <button class="touch-btn" id="btn-inv">📦</button>
      <button class="touch-btn" id="btn-action">⛏️</button>
    </div>
  </div>

  <div id="inventory-modal">
    <h2>ENVANTER VE ÜRETİM</h2>
    <div class="inventory-container">
      <div class="main-inv-area">
        <div class="section-title">Hotbar (Hızlı Erişim - 5 Slot)</div>
        <div class="inv-grid" id="modal-hotbar-grid"></div>
        <div class="section-title">Ana Depo (17 Slot)</div>
        <div class="inv-grid" id="modal-storage-grid" style="grid-template-columns: repeat(4, 1fr);"></div>
      </div>
      <div class="armor-equip-area">
        <div class="section-title">Zırhlar</div>
        <div class="inv-slot" id="armor-slot-head" title="Kask"></div>
        <div class="inv-slot" id="armor-slot-chest" title="Göğüslük"></div>
        <div class="inv-slot" id="armor-slot-legs" title="Pantolon"></div>
        <div class="inv-slot" id="armor-slot-boots" title="Bot"></div>
      </div>
    </div>
    <div class="section-title" style="margin-top: 8px;">Üretim Reçeteleri</div>
    <div class="recipe-list" id="recipe-list"></div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById("mobile-controls").style.display = "flex";
    document.getElementById("desktop-hint").style.display = "none";
  }
}
window.addEventListener("resize", resize);
resize();

const TILE_SIZE = 32;
const ZOOM = 1.85; 
const MAP_W = 200;
const MAP_H = 120;

const ITEM_TYPES = {
  0: { name: "Hava", solid: false },
  1: { name: "Çimen", solid: true, time: 30, color: "#5bb32a", darkColor: "#3e801b", borderHighlight: "#8ee356" },
  2: { name: "Toprak", solid: true, time: 40, color: "#866043", darkColor: "#573d2a", borderHighlight: "#a37857" },
  3: { name: "Taş", solid: true, time: 140, needTool: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3" },
  4: { name: "Ağaç Gövdesi", solid: true, time: 80, color: "#674627", darkColor: "#3d2815", borderHighlight: "#8a5e36" },
  5: { name: "Yaprak", solid: false, time: 15, color: "#2d8a1e", darkColor: "#1a5710", borderHighlight: "#45b033" },
  6: { name: "Kömür", solid: true, time: 180, needTool: true, isOre: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#171717" },
  7: { name: "Bakır", solid: true, time: 220, needTool: true, isOre: true, color: "#737373", darkColor: "#404040", borderHighlight: "#a3a3a3", oreColor: "#f97316" },
  8: { name: "Ahşap Blok", solid: true, time: 60, color: "#a16207", darkColor: "#713f12", borderHighlight: "#ca8a04" },
  9: { name: "Çubuk", solid: false, isItem: true, color: "#78350f" },
  10: { name: "Tahta Kazma", solid: false, isTool: true, speed: 4.0, color: "#d97706" },
  11: { name: "Taş Kazma", solid: false, isTool: true, speed: 8.0, color: "#94a3b8" },
  12: { name: "Bakır Kazma", solid: false, isTool: true, speed: 14.0, color: "#f97316" },

  // Zırh Parçaları
  13: { name: "Taş Kask", solid: false, isArmor: true, armorType: 'head', color: "#64748b" },
  14: { name: "Taş Göğüslük", solid: false, isArmor: true, armorType: 'chest', color: "#64748b" },
  15: { name: "Taş Pantolon", solid: false, isArmor: true, armorType: 'legs', color: "#475569" },
  16: { name: "Taş Bot", solid: false, isArmor: true, armorType: 'boots', color: "#334155" },

  17: { name: "Bakır Kask", solid: false, isArmor: true, armorType: 'head', color: "#ea580c" },
  18: { name: "Bakır Göğüslük", solid: false, isArmor: true, armorType: 'chest', color: "#ea580c" },
  19: { name: "Bakır Pantolon", solid: false, isArmor: true, armorType: 'legs', color: "#c2410c" },
  20: { name: "Bakır Bot", solid: false, isArmor: true, armorType: 'boots', color: "#9a3412" }
};

let world = [];
let surfaceY = 40;

function initWorld() {
  world = [];
  for (let y = 0; y < MAP_H; y++) {
    world[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      if (y < curSurface) {
        world[y][x] = 0;
      } else if (y === curSurface) {
        world[y][x] = 1;
      } else if (y < curSurface + 10) {
        world[y][x] = 2;
      } else {
        let r = Math.random();
        if (r < 0.06) world[y][x] = 6;
        else if (r < 0.09) world[y][x] = 7;
        else world[y][x] = 3;
      }
    }
  }

  for (let x = 8; x < MAP_W - 8; x += Math.floor(Math.random() * 5) + 5) {
    if (Math.random() > 0.3) {
      let curSurface = surfaceY + Math.floor(Math.sin(x * 0.08) * 5 + Math.cos(x * 0.04) * 3);
      let treeH = Math.floor(Math.random() * 3) + 4;
      for (let h = 1; h <= treeH; h++) {
        if (curSurface - h >= 0) world[curSurface - h][x] = 4;
      }
      let top = curSurface - treeH;
      for (let lx = -2; lx <= 2; lx++) {
        for (let ly = -3; ly <= -1; ly++) {
          if (world[top + ly] && world[top + ly][x + lx] === 0) {
            world[top + ly][x + lx] = 5;
          }
        }
      }
    }
  }
}
initWorld();

let timeOfDay = 0;
function updateTime(amount) {
  timeOfDay = (timeOfDay + amount) % 1.0;
  document.getElementById("time-display").innerText = timeOfDay < 0.5 ? "☀️ Gündüz" : "🌙 Gece";
}

let player = {
  x: 20 * TILE_SIZE,
  y: (surfaceY - 4) * TILE_SIZE,
  w: 18,
  h: 42,
  vx: 0,
  vy: 0,
  accX: 0.6,
  maxSpeed: 2.8,
  friction: 0.8,
  grounded: false,
  facing: 1,
  selectedSlot: 0,
  animFrame: 0
};

let camX = player.x;
let camY = player.y;

const hotbar = [
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }
];
// Envantere 5 slot daha eklendi (Toplam 17 slot depolama)
const storage = [
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 },
  { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }, { id: 0, count: 0 }
];

// Giyilen Zırh Slotları
const equippedArmor = {
  head: { id: 0, count: 0 },
  chest: { id: 0, count: 0 },
  legs: { id: 0, count: 0 },
  boots: { id: 0, count: 0 }
};

const itemCounts = {};

function updateItemCounts() {
  for (let key in itemCounts) delete itemCounts[key];
  const tally = (slot) => {
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      itemCounts[slot.id] = (itemCounts[slot.id] || 0) + slot.count;
    } else {
      slot.id = 0;
      slot.count = 0;
    }
  };
  hotbar.forEach(tally);
  storage.forEach(tally);
  Object.values(equippedArmor).forEach(tally);
}

function addPlayerItem(itemId, count = 1) {
  for (let i = 0; i < hotbar.length; i++) {
    if (hotbar[i].id === itemId) {
      hotbar[i].count += count;
      updateItemCounts();
      return;
    }
  }
  for (let i = 0; i < storage.length; i++) {
    if (storage[i].id === itemId) {
      storage[i].count += count;
      updateItemCounts();
      return;
    }
  }
  for (let i = 0; i < hotbar.length; i++) {
    if (hotbar[i].id === 0 || hotbar[i].count <= 0) {
      hotbar[i].id = itemId;
      hotbar[i].count = count;
      updateItemCounts();
      return;
    }
  }
  for (let i = 0; i < storage.length; i++) {
    if (storage[i].id === 0 || storage[i].count <= 0) {
      storage[i].id = itemId;
      storage[i].count = count;
      updateItemCounts();
      return;
    }
  }
}

function consumePlayerItem(itemId, amount = 1) {
  let remaining = amount;
  for (let i = storage.length - 1; i >= 0; i--) {
    if (remaining > 0 && storage[i].id === itemId) {
      let take = Math.min(storage[i].count, remaining);
      storage[i].count -= take;
      remaining -= take;
      if (storage[i].count <= 0) { storage[i].id = 0; storage[i].count = 0; }
    }
  }
  for (let i = hotbar.length - 1; i >= 0; i--) {
    if (remaining > 0 && hotbar[i].id === itemId) {
      let take = Math.min(hotbar[i].count, remaining);
      hotbar[i].count -= take;
      remaining -= take;
      if (hotbar[i].count <= 0) { hotbar[i].id = 0; hotbar[i].count = 0; }
    }
  }
  updateItemCounts();
}

const keys = {};
let mining = { active: false, x: -1, y: -1, progress: 0 };

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ("12345".includes(e.key)) player.selectedSlot = parseInt(e.key) - 1;
  if ((k === "w" || k === " ") && player.grounded) {
    player.vy = -6.8; 
    player.grounded = false;
    timeOfDay = 0.0;
    updateTime(0);
  }
  if (k === "e") toggleInventoryModal();
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function bindTouchButton(id, actionDown, actionUp) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener("touchstart", (e) => { e.preventDefault(); actionDown(); });
  btn.addEventListener("touchend", (e) => { e.preventDefault(); if (actionUp) actionUp(); });
  btn.addEventListener("mousedown", (e) => { e.preventDefault(); actionDown(); });
  btn.addEventListener("mouseup", (e) => { e.preventDefault(); if (actionUp) actionUp(); });
}

bindTouchButton("btn-left", () => keys["a"] = true, () => keys["a"] = false);
bindTouchButton("btn-right", () => keys["d"] = true, () => keys["d"] = false);
bindTouchButton("btn-jump", () => {
  if (player.grounded) { player.vy = -6.8; player.grounded = false; }
});
bindTouchButton("btn-inv", () => toggleInventoryModal());
bindTouchButton("btn-action", () => {
  let tx = Math.floor((player.x + player.w/2) / TILE_SIZE);
  let ty = Math.floor((player.y + player.h/2) / TILE_SIZE);
  if (world[ty]?.[tx] !== 0) {
    let mined = world[ty][tx];
    world[ty][tx] = 0;
    addPlayerItem(mined, 1);
  }
});

function isSolidBlock(px, py) {
  let tx = Math.floor(px / TILE_SIZE);
  let ty = Math.floor(py / TILE_SIZE);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  return ITEM_TYPES[world[ty][tx]].solid;
}

function updatePhysics() {
  if (keys["a"] || keys["arrowleft"]) {
    player.vx -= player.accX;
    player.facing = -1;
    updateTime(0.0005);
  } else if (keys["d"] || keys["arrowright"]) {
    player.vx += player.accX;
    player.facing = 1;
    updateTime(0.0005);
  } else {
    player.vx *= player.friction;
  }

  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.vy += 0.42;

  if (Math.abs(player.vx) > 0.2 && player.grounded) player.animFrame += 0.2;
  else player.animFrame = 0;

  player.x += player.vx;
  if (player.vx > 0 && (isSolidBlock(player.x + player.w, player.y) || isSolidBlock(player.x + player.w, player.y + player.h - 2))) {
    player.x = Math.floor((player.x + player.w) / TILE_SIZE) * TILE_SIZE - player.w - 0.1;
    player.vx = 0;
  }
  if (player.vx < 0 && (isSolidBlock(player.x, player.y) || isSolidBlock(player.x, player.y + player.h - 2))) {
    player.x = Math.floor(player.x / TILE_SIZE + 1) * TILE_SIZE + 0.1;
    player.vx = 0;
  }

  player.y += player.vy;
  player.grounded = false;
  if (player.vy > 0 && (isSolidBlock(player.x + 2, player.y + player.h) || isSolidBlock(player.x + player.w - 2, player.y + player.h))) {
    player.y = Math.floor((player.y + player.h) / TILE_SIZE) * TILE_SIZE - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  if (mining.active) {
    let activeSlot = hotbar[player.selectedSlot];
    let activeItem = activeSlot.count > 0 ? activeSlot.id : 0;
    let speed = ITEM_TYPES[activeItem]?.speed || 1.0;
    let target = world[mining.y]?.[mining.x];

    if (target && target !== 0) {
      if (ITEM_TYPES[target].needTool && !ITEM_TYPES[activeItem]?.isTool) {
        mining.progress = 0;
      } else {
        mining.progress += speed;
        if (mining.progress >= ITEM_TYPES[target].time) {
          addPlayerItem(target, 1);
          world[mining.y][mining.x] = 0;
          mining.active = false;
        }
      }
    } else {
      mining.active = false;
    }
  }
}

function renderTile(id, x, y, size, targetCtx) {
  if (!id || id === 0) return;
  const info = ITEM_TYPES[id];
  
  if (info.isTool) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + 4, y + 6, size - 8, 5);
    targetCtx.fillStyle = "#78350f";
    targetCtx.fillRect(x + size / 2 - 2, y + 10, 4, size - 14);
    return;
  }

  if (info.isItem) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + size / 2 - 2, y + 4, 4, size - 8);
    return;
  }

  if (info.isArmor) {
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x + 5, y + 5, size - 10, size - 10);
    targetCtx.strokeStyle = "#fff";
    targetCtx.lineWidth = 1;
    targetCtx.strokeRect(x + 5, y + 5, size - 10, size - 10);
    return;
  }

  targetCtx.fillStyle = info.color;
  targetCtx.fillRect(x, y, size, size);

  targetCtx.fillStyle = info.borderHighlight;
  targetCtx.fillRect(x, y, size, 3);
  targetCtx.fillRect(x, y, 3, size);

  targetCtx.fillStyle = info.darkColor;
  targetCtx.fillRect(x, y + size - 3, size, 3);
  targetCtx.fillRect(x + size - 3, y, 3, size);

  if (id === 1) {
    targetCtx.fillStyle = "#866043";
    targetCtx.fillRect(x + 3, y + 10, size - 6, size - 13);
    targetCtx.fillStyle = info.color;
    targetCtx.fillRect(x, y, size, 8);
  } else if (id === 2 || id === 3) {
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 5, y + 6, 6, 5);
  } else if (id === 6 || id === 7) {
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 4, y + 5, 5, 5);
    targetCtx.fillRect(x + 20, y + 18, 6, 5);
    targetCtx.fillStyle = info.oreColor;
    targetCtx.fillRect(x + 6, y + 7, 5, 5);
    targetCtx.fillRect(x + 21, y + 19, 4, 4);
  } else if (id === 4) {
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 6, y + 3, 4, size - 6);
  } else if (id === 5) {
    targetCtx.fillStyle = info.darkColor;
    targetCtx.fillRect(x + 4, y + 4, 8, 8);
  }
}

// Oyuncu Render (Tam Zırh Görünümü ve İki Kol Hatasız Çizim)
function renderPlayerTerraria(screenX, screenY) {
  let anim = Math.sin(player.animFrame) * 4;
  ctx.save();
  ctx.translate(screenX + player.w / 2, screenY + player.h / 2);
  if (player.facing === -1) ctx.scale(-1, 1);

  // Botlar (Ayaklar)
  let bootsItem = ITEM_TYPES[equippedArmor.boots.id];
  ctx.fillStyle = bootsItem ? bootsItem.color : "#451a03";
  ctx.fillRect(-6, 15 + anim, 5, 5);
  ctx.fillRect(2, 15 - anim, 5, 5);

  // Pantolon
  let legsItem = ITEM_TYPES[equippedArmor.legs.id];
  ctx.fillStyle = legsItem ? legsItem.color : "#1e3a8a";
  ctx.fillRect(-6, 5, 5, 10);
  ctx.fillRect(2, 5, 5, 10);

  // Gövde ve Göğüslük
  let chestItem = ITEM_TYPES[equippedArmor.chest.id];
  ctx.fillStyle = chestItem ? chestItem.color : "#dc2626";
  ctx.fillRect(-7, -8, 14, 13);

  // Sağ Kol ve Elindeki Eşya / Alet (Kırma Animasyonlu)
  ctx.fillStyle = "#fca5a5";
  let armAngle = mining.active ? Math.sin(Date.now() * 0.02) * 0.8 : -0.2;
  ctx.save();
  ctx.translate(6, -4);
  ctx.rotate(armAngle);
  ctx.fillRect(0, 0, 4, 10);

  let activeSlot = hotbar[player.selectedSlot];
  if (activeSlot.count > 0 && activeSlot.id !== 0) {
    ctx.save();
    ctx.translate(2, 8);
    renderTile(activeSlot.id, -8, -8, 20, ctx);
    ctx.restore();
  }
  ctx.restore();

  // Sol Kol (Kayıp olma sorunu giderildi, her zaman yerinde)
  ctx.fillStyle = "#fca5a5";
  ctx.fillRect(-10, -6 - anim * 0.5, 4, 10);

  // Kafa
  ctx.fillStyle = "#fca5a5";
  ctx.fillRect(-6, -21, 13, 13);

  // Gözler
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(-2, -16, 2, 4);
  ctx.fillRect(3, -16, 2, 4);

  // Kask / Saç
  let headItem = ITEM_TYPES[equippedArmor.head.id];
  if (headItem) {
    ctx.fillStyle = headItem.color;
    ctx.fillRect(-7, -24, 15, 6);
  } else {
    ctx.fillStyle = "#78350f";
    ctx.fillRect(-7, -23, 15, 4);
  }

  ctx.restore();
}

function render() {
  camX += (player.x - camX) * 0.1;
  camY += (player.y - camY) * 0.1;

  ctx.save();
  ctx.scale(ZOOM, ZOOM);

  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;
  let drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, camX - viewW / 2));
  let drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, camY - viewH / 2));

  let skyGrad = ctx.createLinearGradient(0, 0, 0, viewH);
  if (timeOfDay < 0.5) {
    skyGrad.addColorStop(0, "#0284c7");
    skyGrad.addColorStop(1, "#7dd3fc");
  } else {
    skyGrad.addColorStop(0, "#020617");
    skyGrad.addColorStop(1, "#0f172a");
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, viewW, viewH);

  let startX = Math.max(0, Math.floor(drawCamX / TILE_SIZE));
  let endX = Math.min(MAP_W, Math.ceil((drawCamX + viewW) / TILE_SIZE));
  let startY = Math.max(0, Math.floor(drawCamY / TILE_SIZE));
  let endY = Math.min(MAP_H, Math.ceil((drawCamY + viewH) / TILE_SIZE));

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      let tile = world[y][x];
      if (tile !== 0) {
        renderTile(tile, x * TILE_SIZE - drawCamX, y * TILE_SIZE - drawCamY, TILE_SIZE, ctx);
      }
    }
  }

  if (mining.active) {
    let bx = mining.x * TILE_SIZE - drawCamX;
    let by = mining.y * TILE_SIZE - drawCamY;
    let target = world[mining.y][mining.x];
    let ratio = mining.progress / ITEM_TYPES[target].time;

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, TILE_SIZE, TILE_SIZE);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(bx, by, TILE_SIZE * ratio, TILE_SIZE);
  }

  renderPlayerTerraria(player.x - drawCamX, player.y - drawCamY);
  ctx.restore();

  renderCanvasHotbarUI();
}

function renderCanvasHotbarUI() {
  const slotSize = 48;
  const gap = 8;
  const startX = (canvas.width - (5 * slotSize + 4 * gap)) / 2;
  const startY = canvas.height - slotSize - 16;

  updateItemCounts();

  for (let i = 0; i < 5; i++) {
    let sx = startX + i * (slotSize + gap);
    let sy = startY;

    ctx.fillStyle = i === player.selectedSlot ? "rgba(56, 189, 248, 0.3)" : "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(sx, sy, slotSize, slotSize);

    ctx.strokeStyle = i === player.selectedSlot ? "#38bdf8" : "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = i === player.selectedSlot ? 3 : 1.5;
    ctx.strokeRect(sx, sy, slotSize, slotSize);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText(i + 1, sx + 4, sy + 12);

    let slot = hotbar[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      renderTile(slot.id, sx + 8, sy + 8, 32, ctx);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(slot.count, sx + slotSize - 4, sy + slotSize - 4);
        ctx.textAlign = "left";
      }
    }
  }
}

let draggedItemInfo = null;

function buildInventoryUI() {
  updateItemCounts();

  const hbGrid = document.getElementById("modal-hotbar-grid");
  hbGrid.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    let slotDiv = document.createElement("div");
    slotDiv.className = "inv-slot";
    let slot = hotbar[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      let c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      renderTile(slot.id, 0, 0, 32, c.getContext("2d"));
      slotDiv.appendChild(c);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        let b = document.createElement("b");
        b.innerText = slot.count;
        slotDiv.appendChild(b);
      }
      slotDiv.dataset.itemName = ITEM_TYPES[slot.id].name;
    }
    setupTooltipEvents(slotDiv);
    setupDragAndDropEvents(slotDiv, 'hotbar', i);
    hbGrid.appendChild(slotDiv);
  }

  const stGrid = document.getElementById("modal-storage-grid");
  stGrid.innerHTML = "";
  for (let i = 0; i < storage.length; i++) {
    let slotDiv = document.createElement("div");
    slotDiv.className = "inv-slot";
    let slot = storage[i];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      let c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      renderTile(slot.id, 0, 0, 32, c.getContext("2d"));
      slotDiv.appendChild(c);
      if (!ITEM_TYPES[slot.id].isTool && !ITEM_TYPES[slot.id].isArmor) {
        let b = document.createElement("b");
        b.innerText = slot.count;
        slotDiv.appendChild(b);
      }
      slotDiv.dataset.itemName = ITEM_TYPES[slot.id].name;
    }
    setupTooltipEvents(slotDiv);
    setupDragAndDropEvents(slotDiv, 'storage', i);
    stGrid.appendChild(slotDiv);
  }

  // Zırh Kuşanma Slotları (PC için sürükle bırak destekli)
  ['head', 'chest', 'legs', 'boots'].forEach(type => {
    let slotDiv = document.getElementById(`armor-slot-${type}`);
    slotDiv.innerHTML = "";
    let slot = equippedArmor[type];
    if (slot.id && slot.id !== 0 && slot.count > 0) {
      let c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      renderTile(slot.id, 0, 0, 32, c.getContext("2d"));
      slotDiv.appendChild(c);
      slotDiv.dataset.itemName = ITEM_TYPES[slot.id].name;
    } else {
      slotDiv.dataset.itemName = type.toUpperCase() + " ZIRH SLOTU";
    }
    setupTooltipEvents(slotDiv);
    setupArmorDragAndDropEvents(slotDiv, type);
  });

  const list = document.getElementById("recipe-list");
  list.innerHTML = "";
  craftingRecipes.forEach(r => {
    let canCraft = Object.keys(r.cost).every(k => (itemCounts[k] || 0) >= r.cost[k]);
    let card = document.createElement("div");
    card.className = "recipe-card" + (canCraft ? "" : " disabled");
    card.innerHTML = `<span>${r.name}</span><span class="craft-btn">${canCraft ? "ÜRET" : "Eksik"}</span>`;
    card.onclick = () => {
      if (canCraft) {
        Object.keys(r.cost).forEach(k => consumePlayerItem(parseInt(k), r.cost[k]));
        addPlayerItem(r.item, r.count);
        buildInventoryUI();
      }
    };
    list.appendChild(card);
  });
}

const tooltip = document.getElementById("tooltip");
function setupTooltipEvents(elem) {
  elem.onmousemove = (e) => {
    let name = elem.dataset.itemName;
    if (name) {
      tooltip.innerText = name;
      tooltip.style.display = "block";
      tooltip.style.left = (e.clientX + 12) + "px";
      tooltip.style.top = (e.clientY + 12) + "px";
    }
  };
  elem.onmouseleave = () => tooltip.style.display = "none";
}

function setupDragAndDropEvents(elem, type, index) {
  elem.draggable = true;
  elem.ondragstart = (e) => {
    draggedItemInfo = { type, index };
    tooltip.style.display = "none";
  };
  elem.ondragover = (e) => e.preventDefault();
  elem.ondrop = (e) => {
    e.preventDefault();
    if (!draggedItemInfo) return;
    let srcType = draggedItemInfo.type;
    let srcIdx = draggedItemInfo.index;

    let sourceSlot = srcType === 'hotbar' ? hotbar[srcIdx] : (srcType === 'storage' ? storage[srcIdx] : equippedArmor[srcType]);
    let targetSlot = type === 'hotbar' ? hotbar[index] : storage[index];

    let temp = { id: sourceSlot.id, count: sourceSlot.count };
    sourceSlot.id = targetSlot.id;
    sourceSlot.count = targetSlot.count;
    targetSlot.id = temp.id;
    targetSlot.count = temp.count;

    draggedItemInfo = null;
    buildInventoryUI();
  };
}

function setupArmorDragAndDropEvents(elem, armorType) {
  elem.draggable = true;
  elem.ondragstart = (e) => {
    draggedItemInfo = { type: armorType, index: 0 };
    tooltip.style.display = "none";
  };
  elem.ondragover = (e) => e.preventDefault();
  elem.ondrop = (e) => {
    e.preventDefault();
    if (!draggedItemInfo) return;
    let srcType = draggedItemInfo.type;
    let srcIdx = draggedItemInfo.index;

    let sourceSlot = srcType === 'hotbar' ? hotbar[srcIdx] : (srcType === 'storage' ? storage[srcIdx] : equippedArmor[srcType]);
    let targetSlot = equippedArmor[armorType];

    // Gelen eşyanın bu zırh slotuna uygun olup olmadığını kontrol et
    if (sourceSlot.id !== 0 && ITEM_TYPES[sourceSlot.id].armorType === armorType) {
      let temp = { id: sourceSlot.id, count: sourceSlot.count };
      sourceSlot.id = targetSlot.id;
      sourceSlot.count = targetSlot.count;
      targetSlot.id = temp.id;
      targetSlot.count = temp.count;
    } else if (sourceSlot.id === 0) {
      targetSlot.id = 0;
      targetSlot.count = 0;
    }

    draggedItemInfo = null;
    buildInventoryUI();
  };
}

const craftingRecipes = [
  { item: 8, count: 4, cost: { 4: 1 }, name: "Ahşap Blok (4x)" },
  { item: 9, count: 4, cost: { 8: 2 }, name: "Ahşap Çubuk (4x)" },
  { item: 10, count: 1, cost: { 8: 3, 9: 2 }, name: "Tahta Kazma" },
  { item: 11, count: 1, cost: { 3: 3, 9: 2 }, name: "Taş Kazma" },
  { item: 12, count: 1, cost: { 7: 3, 9: 2 }, name: "Bakır Kazma" },
  { item: 13, count: 1, cost: { 3: 5 }, name: "Taş Kask" },
  { item: 14, count: 1, cost: { 3: 8 }, name: "Taş Göğüslük" },
  { item: 15, count: 1, cost: { 3: 6 }, name: "Taş Pantolon" },
  { item: 16, count: 1, cost: { 3: 4 }, name: "Taş Bot" },
  { item: 17, count: 1, cost: { 7: 5 }, name: "Bakır Kask" },
  { item: 18, count: 1, cost: { 7: 8 }, name: "Bakır Göğüslük" },
  { item: 19, count: 1, cost: { 7: 6 }, name: "Bakır Pantolon" },
  { item: 20, count: 1, cost: { 7: 4 }, name: "Bakır Bot" }
];

function toggleInventoryModal() {
  const modal = document.getElementById("inventory-modal");
  const isVisible = modal.style.display === "block";
  modal.style.display = isVisible ? "none" : "block";
  if (!isVisible) buildInventoryUI();
  else tooltip.style.display = "none";
}

canvas.onmousedown = e => {
  let viewW = canvas.width / ZOOM;
  let viewH = canvas.height / ZOOM;
  let drawCamX = Math.max(0, Math.min(MAP_W * TILE_SIZE - viewW, camX - viewW / 2));
  let drawCamY = Math.max(0, Math.min(MAP_H * TILE_SIZE - viewH, camY - viewH / 2));

  let clickX = (e.clientX / ZOOM) + drawCamX;
  let clickY = (e.clientY / ZOOM) + drawCamY;

  let tx = Math.floor(clickX / TILE_SIZE);
  let ty = Math.floor(clickY / TILE_SIZE);

  let dist = Math.hypot(tx * TILE_SIZE - player.x, ty * TILE_SIZE - player.y);
  if (dist > TILE_SIZE * 8) return;

  if (e.button === 0 && world[ty]?.[tx] !== 0) {
    mining.active = true;
    mining.x = tx;
    mining.y = ty;
    mining.progress = 0;
  } else if (e.button === 2) {
    let activeSlot = hotbar[player.selectedSlot];
    let activeItem = activeSlot.count > 0 ? activeSlot.id : 0;
    if (activeItem && !ITEM_TYPES[activeItem].isTool && !ITEM_TYPES[activeItem].isItem && !ITEM_TYPES[activeItem].isArmor && world[ty]?.[tx] === 0) {
      world[ty][tx] = activeItem;
      consumePlayerItem(activeItem, 1);
    }
  }
};

canvas.onmouseup = () => mining.active = false;
canvas.oncontextmenu = e => e.preventDefault();

function loop() {
  updatePhysics();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
